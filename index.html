<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT-Playlists • Organise your favourite YouTube videos</title>
<meta name="description" content="A quiet, ad-free way to collect and organise your favourite YouTube videos in your own collections. Free.">
<meta property="og:title" content="YT Playlists">
<meta property="og:description" content="Collect and organise your favourite YouTube videos in your own collections. Free.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FF0034'/%3E%3Cpath d='M11.5 8v16l13-8z' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#17181a;
    --panel:#1f2124;
    --line:#2c2f33;
    --ink:#f2f1ee;
    --ink-dim:#9a9c9f;
    --focus:#7ea6c4;
    --cols:5;
    --radius:4px;
    --thumb-radius:calc(56px / var(--cols));
    --nav-h:66px;
    --aside-w:168px;
  }
  *{box-sizing:border-box}
  html{scrollbar-gutter:stable;overflow-y:scroll}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1700px;margin:0 auto;padding:0 28px 80px}

  header{
    position:sticky;top:0;z-index:40;
    background:transparent;transition:background-color .2s ease;
  }
  header.stuck{
    background:rgba(23,24,26,.55);
    backdrop-filter:blur(18px) saturate(1.4);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    header.stuck{background:rgba(23,24,26,.94)}
  }
  .navinner{
    position:relative;max-width:1700px;margin:0 auto;padding:16px 28px;
    display:flex;gap:6px 16px;align-items:center;flex-wrap:wrap;
    height:var(--nav-h);font-size:12.5px;color:var(--ink-dim);
  }
  header:hover, header:focus-within{color:#c6c8cb}
  .logo{
    flex:0 0 var(--aside-w);width:var(--aside-w);margin-right:16px;
    display:flex;align-items:center;gap:9px;overflow:hidden;
    font-size:13.5px;font-weight:400;color:var(--ink);letter-spacing:.1px;
  }
  .logo:hover{color:var(--ink)}
  .logoicon{
    width:20px;height:20px;flex:none;fill:none;stroke:#6f8fb8;stroke-width:1.3;
    stroke-linecap:round;stroke-linejoin:round;opacity:.95;
    animation:iconglow 14s ease-in-out infinite;
  }
  .logotext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (hover:hover) and (pointer:fine){
    .logo:hover .logotext{
      background:linear-gradient(90deg,#ff5f6d,#ffc371,#7afcff,#7a86ff,#ff5fd8,#ff5f6d);
      background-size:300% 100%;
      -webkit-background-clip:text;background-clip:text;color:transparent;
      animation:pillshift 3s linear infinite;
    }
    .logo:hover .logoicon{
      animation:logoiconglow 2.2s ease-in-out infinite;
    }
  }
  @keyframes logoiconglow{
    0%,100%{stroke:#ff5f6d;filter:drop-shadow(0 0 6px rgba(255,95,109,.65))}
    20%{stroke:#ffc371;filter:drop-shadow(0 0 6px rgba(255,195,113,.65))}
    40%{stroke:#7afcff;filter:drop-shadow(0 0 6px rgba(122,252,255,.65))}
    60%{stroke:#7a86ff;filter:drop-shadow(0 0 6px rgba(122,134,255,.65))}
    80%{stroke:#ff5fd8;filter:drop-shadow(0 0 6px rgba(255,95,216,.65))}
  }
  @media (prefers-reduced-motion:reduce){ .logo:hover .logotext, .logo:hover .logoicon{animation:none} }
  body.sidebar-collapsed .logo{flex-basis:var(--aside-w);width:var(--aside-w);justify-content:center}
  body.sidebar-collapsed .logotext{display:none}
  .sep{flex:1}
  .tools{display:flex;align-items:center;gap:14px}

  input[type=text]{
    background:transparent;border:0;color:var(--ink);
    font:inherit;font-size:12.5px;padding:3px 0;
  }
  input[type=text]::placeholder{color:#7c7f83}

  #url:hover::placeholder,#url:focus::placeholder{color:#a7a9ac}

  #newname{border-bottom:1px solid transparent;width:100%;transition:border-color .18s ease}
  #newname:hover,#newname:focus{outline:none;border-bottom-color:var(--line)}

  .addwrap{
    padding:1px;border-radius:999px;
    background:linear-gradient(90deg,#3d4a5a,#4b4059,#37514c,#4a4553,#3d4a5a);
    background-size:400% 100%;
    animation:pillshift 18s linear infinite;
    transition:box-shadow .2s ease;
  }
  @keyframes pillshift{from{background-position:0% 50%}to{background-position:400% 50%}}
  .addwrap:focus-within{background-size:250% 100%;animation-duration:9s}
  .addwrap:hover{background-size:250% 100%;animation-duration:9s;box-shadow:0 0 0 1px rgba(255,255,255,.3),0 0 18px rgba(126,166,196,.4)}
  #url{
    display:block;background:rgba(23,24,26,.72);border-radius:999px;
    padding:6px 16px;width:320px;
    transition:width .2s ease, background-color .2s ease;
  }
  #url:hover{background:rgba(48,51,56,.9);width:480px}
  #url:focus{outline:none;background:rgba(48,51,56,.9);width:480px}
  @media (prefers-reduced-motion:reduce){ .addwrap{animation:none} }


  /* ---------- search ---------- */
  .searchwrap{flex:none}
  .searchbox{
    display:flex;align-items:center;overflow:hidden;
    background:rgba(23,24,26,.72);border-radius:999px;
    height:30px;width:30px;
    transition:width .22s ease, background-color .2s ease;
  }
  .searchbox:hover{background:rgba(48,51,56,.9)}
  .searchwrap.open .searchbox{width:300px;background:rgba(48,51,56,.9)}
  .searchico{
    flex:none;width:30px;height:30px;display:grid;place-items:center;
    padding:0;color:var(--ink);
  }
  .searchico svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #search{display:none;flex:1;min-width:0;width:100%;padding:0 2px}
  #search:focus{outline:none}
  .searchwrap.open #search{display:block}
  .searchx{
    flex:none;width:30px;height:30px;display:none;place-items:center;
    padding:0;color:var(--ink-dim);
  }
  .searchwrap.open .searchx{display:grid}
  .searchx:hover{color:var(--ink)}
  .searchx svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  .incols{font-size:11px;color:var(--ink-dim);opacity:.72;margin-top:3px;line-height:1.35}
  @media (max-width:1100px){ .searchwrap.open .searchbox{width:200px} }

  .luckywrap{flex:none}
  .luckybtn{
    display:block;background:rgba(23,24,26,.72);border-radius:999px;
    padding:6px 18px;font:inherit;font-size:12.5px;color:var(--ink);
    white-space:nowrap;transition:background-color .2s ease;
  }
  .luckybtn:hover{background:rgba(48,51,56,.9)}
  @media (hover:hover) and (pointer:fine){
    .luckywrap:hover{
      background:linear-gradient(90deg,#ff5f6d,#ffc371,#7afcff,#7a86ff,#ff5fd8,#ff5f6d);
      background-size:300% 100%;
      animation:pillshift 3s linear infinite, luckyglow 2.2s ease-in-out infinite;
    }
  }
  @keyframes luckyglow{
    0%,100%{box-shadow:0 0 18px 2px rgba(255,95,109,.45)}
    20%{box-shadow:0 0 18px 2px rgba(255,195,113,.45)}
    40%{box-shadow:0 0 18px 2px rgba(122,252,255,.45)}
    60%{box-shadow:0 0 18px 2px rgba(122,134,255,.45)}
    80%{box-shadow:0 0 18px 2px rgba(255,95,216,.45)}
  }
  @media (prefers-reduced-motion:reduce){ .luckywrap:hover{animation:none} }

  button{-webkit-appearance:none;appearance:none;background:none;border:0;color:inherit;font:inherit;font-size:12.5px;padding:3px 2px;cursor:pointer;border-radius:2px}
  button:hover{color:var(--ink)}
  input[type=range]{display:none}
  #emptytrash{display:none;color:var(--ink-dim)}
  #emptytrash.on{display:inline}
  .icon{display:inline-grid;place-items:center;padding:2px;color:var(--ink-dim);opacity:.75}
  .icon:hover{opacity:1;color:var(--ink)}
  .icon:disabled{opacity:.3;pointer-events:none}
  .icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  #gear svg{transition:transform .35s ease}
  #gear:hover svg{transform:rotate(180deg)}
  :focus-visible{outline:1px solid var(--focus);outline-offset:3px}

  /* collections */
  .body{display:flex;gap:32px;align-items:flex-start}
  aside{
    position:fixed;top:var(--nav-h);
    left:calc(28px + max(0px, (100vw - 1700px) / 2));
    width:var(--aside-w);height:calc(100vh - var(--nav-h));
    z-index:30;transition:width .18s ease;
    display:flex;flex-direction:column;
  }
  aside::before{
    content:'';position:absolute;inset:0;z-index:-1;
    background:rgba(23,24,26,.55);
    backdrop-filter:blur(18px) saturate(1.4);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
    -webkit-mask-image:linear-gradient(to right, black 0%, black 75%, transparent 100%);
    mask-image:linear-gradient(to right, black 0%, black 75%, transparent 100%);
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    aside::before{background:rgba(23,24,26,.94);-webkit-mask-image:none;mask-image:none}
  }
  #side{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    font-size:12.5px;color:var(--ink-dim);
    scrollbar-width:none;-ms-overflow-style:none;
  }
  #side::-webkit-scrollbar{display:none}
  .sidetoggle{
    flex:none;margin-top:auto;padding-top:12px;margin-bottom:20px;
    display:flex;align-items:center;gap:8px;width:calc(100% + 12px);margin-left:-6px;
    padding-left:6px;padding-right:6px;padding-bottom:7px;
    border-radius:3px;color:var(--ink-dim);font-size:12.5px;text-align:left;
  }
  .sidetoggle:hover{background:#1e2023;color:var(--ink)}
  .sidetoggle svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s ease}
  .sidetoggle .lbl{white-space:nowrap;overflow:hidden}
  aside.collapsed{align-items:center}
  aside.collapsed #side{display:none}
  aside.collapsed .sidetoggle{
    width:28px;height:28px;margin-left:0;padding:0;justify-content:center;
    border:1px solid var(--line);border-radius:50%;
  }
  aside.collapsed .sidetoggle:hover{border-color:#4d525a}
  aside.collapsed .sidetoggle svg{transform:rotate(180deg)}
  aside.collapsed .sidetoggle .lbl{display:none}
  .col{display:flex;align-items:center;gap:8px;padding:4px 6px;margin:0 -6px;border-radius:3px;cursor:pointer;user-select:none}
  .col:hover{background:#1e2023;color:#c6c8cb}
  .col.active{color:var(--ink)}
  .col.active .n{opacity:.6}
  .col.drop{background:#25282c;box-shadow:inset 2px 0 0 var(--focus);color:var(--ink)}
  .col .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .col .name[contenteditable="true"]:focus{outline:none;background:#2a2d31;border-radius:2px;padding:0 2px;text-overflow:clip}
  .col .side{position:relative;flex:0 0 auto;width:18px;height:16px}
  .col .n{
    position:absolute;top:0;right:0;line-height:16px;
    font-size:11px;opacity:.45;font-variant-numeric:tabular-nums;
    text-align:right;transition:opacity .12s;
  }
  .col:hover .n{opacity:0}
  .col .edit{
    position:absolute;top:0;right:0;border:0;background:none;color:inherit;
    cursor:pointer;padding:0;width:16px;height:16px;display:inline-grid;place-items:center;opacity:0;
  }
  .col .edit svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .col:hover .edit{opacity:.6}
  .col .edit:hover{opacity:1;color:var(--ink)}
  .divide{height:1px;background:var(--line);margin:10px -6px 8px;opacity:.6}
  .newcol{opacity:.5;padding:4px 6px;margin:0 -6px;display:block;text-align:left;width:calc(100% + 12px)}
  .newcol:hover{opacity:1}
  #newname{width:100%}
  #newname:focus{width:100%;border-bottom-color:var(--line)}
  .colinput{
    display:block;width:100%;background:#1c1e21;border:1px solid var(--line);
    border-radius:4px;padding:8px 10px;color:var(--ink);font:inherit;font-size:13px;
    margin-bottom:20px;
  }
  .colinput:focus{outline:none;border-color:var(--focus)}
  .btn-danger{color:#c98686}

  .btn-danger:hover{color:#e08a8a}

  main{
    flex:1;min-width:0;
    margin-left:calc(var(--aside-w) + 32px);
  }
  .grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:26px 20px}
  .sections{display:block}
  .section{margin-bottom:44px}
  .section:last-child{margin-bottom:0}
  .sectionhead{display:flex;align-items:baseline;gap:8px;margin:0 0 12px;font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.2px}
  .sectionhead .cnt{font-size:11px;font-weight:400;color:var(--ink-dim);opacity:.55;font-variant-numeric:tabular-nums}
  .sectiondivide{height:1px;background:var(--line);margin:0 0 20px;opacity:.7}
  .section:first-child .sectionhead{margin-top:4px}

  /* ---------- watch later hero ---------- */
  .hero{margin:0 0 40px}
  .herostage{
    position:relative;width:100%;
    height:min(54vh, calc((100vw - var(--aside-w) - 64px) * 0.5625));
    min-height:180px;
    /* exactly the thumbnail radius, so the hero grows and shrinks its
       corners along with the grid below when the column count changes */
    border-radius:var(--thumb-radius);overflow:hidden;background:#000;cursor:pointer;
  }
  .heroslide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease-in-out;pointer-events:none}
  .heroslide.on{opacity:1}
  .heroslide img{width:100%;height:100%;object-fit:cover;display:block}
  .heroshade{
    position:absolute;inset:0;
    background:linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,.55) 30%,rgba(0,0,0,.08) 64%,rgba(0,0,0,.35) 100%);
  }
  .heroinner{
    position:absolute;left:clamp(18px,3.4vw,48px);right:clamp(18px,3.4vw,48px);
    bottom:clamp(16px,3.4vh,40px);max-width:1100px;
  }
  .herokicker{
    font-size:11px;letter-spacing:.26em;text-transform:uppercase;
    color:rgba(255,255,255,.6);margin-bottom:clamp(7px,1.4vh,14px);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  /* Magazine-style headline. Tight tracking and a sub-1 line-height need the
     padding/margin trick below, otherwise overflow:hidden clips the tails of
     g, j and p on the last visible line. */
  .herotitle{
    font-family:"Helvetica Neue",Helvetica,Inter,Arial,sans-serif;
    font-weight:700;line-height:.94;letter-spacing:-.035em;color:#fff;margin:0;
    text-wrap:balance;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;
    padding-bottom:.14em;margin-bottom:-.14em;
  }
  .herotitle.s1{font-size:clamp(2rem,5vw,4.2rem)}
  .herotitle.s2{font-size:clamp(1.7rem,3.7vw,3.1rem)}
  .herotitle.s3{font-size:clamp(1.4rem,2.6vw,2.2rem);line-height:1;letter-spacing:-.025em}
  .herotitle.s4{font-size:clamp(1.15rem,1.9vw,1.65rem);line-height:1.06;letter-spacing:-.015em;-webkit-line-clamp:4}
  .heronav{
    position:absolute;top:50%;margin-top:-19px;width:38px;height:38px;
    -webkit-appearance:none;appearance:none;padding:0;
    display:grid;place-items:center;cursor:pointer;z-index:3;
    color:#fff;background:rgba(15,15,16,.5);border:1px solid rgba(255,255,255,.35);
    border-radius:50%;opacity:0;transition:opacity .15s, background .15s;backdrop-filter:blur(2px);
  }
  .heronav.prev{left:14px}
  .heronav.next{right:14px}
  .heronav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .herostage:hover .heronav{opacity:.7}
  .heronav:hover{opacity:1;background:rgba(30,32,36,.85)}
  .heroprog{height:2px;margin-top:12px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
  .heroprog i{
    display:block;height:100%;width:100%;background:rgba(255,255,255,.4);
    transform-origin:left center;transform:scaleX(0);
  }
  @media (max-width:760px){ .hero{display:none} }
  @media (pointer:coarse){
    .heronav{opacity:.6;width:44px;height:44px;margin-top:-22px}
    .herokicker{font-size:12px}
  }

  .item{position:relative}
  .glow{
    position:absolute;left:-7%;width:114%;top:6%;aspect-ratio:16/9;
    background-size:cover;background-position:center;
    filter:blur(28px) saturate(1.4);
    opacity:.45;z-index:0;pointer-events:none;
    transition:opacity .3s ease, transform .3s ease, filter .3s ease;
    -webkit-transform:translateZ(0) scale(1);transform:translateZ(0) scale(1);
    will-change:transform;
  }
  .item:hover .glow{opacity:.8;transform:translateZ(0) scale(1.07) translateY(3px);filter:blur(32px) saturate(1.65)}
  .item.dragging{opacity:.35}
  .ghost{
    position:fixed;top:-300px;left:-300px;width:150px;height:84px;
    background-size:cover;background-position:center;border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;
  }
  .item.over .thumb{box-shadow:0 0 0 2px var(--focus)}
  .glow{border-radius:var(--thumb-radius)}

  .thumb{
    position:relative;z-index:1;display:block;width:100%;aspect-ratio:16/9;
    background:#000;border-radius:var(--thumb-radius);overflow:hidden;cursor:pointer;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .play{
    position:absolute;inset:0;margin:auto;width:34px;height:34px;display:grid;place-items:center;
    background:rgba(20,20,20,.35);border:1px solid rgba(255,255,255,.75);border-radius:50%;
    opacity:.75;transition:opacity .15s ease, transform .15s ease;backdrop-filter:blur(2px);
  }
  .play svg{width:11px;height:11px;fill:#fff;margin-left:2px}
  .thumb:hover .play{opacity:1;transform:scale(1.06)}
  .tdel,.tback,.theart,.tkebab,.tlater{
    position:absolute;padding:0;display:grid;place-items:center;
    color:#fff;font-size:13px;line-height:1;
    background:rgba(15,15,16,.5);border:1px solid rgba(255,255,255,.35);border-radius:50%;
    opacity:0;transition:opacity .12s, color .12s;backdrop-filter:blur(2px);
  }
  .theart{top:7px;right:7px;width:32px;height:32px}
  .tlater{top:47px;right:7px;width:32px;height:32px}
  .tdel{top:87px;right:7px;width:32px;height:32px}
  .tback{top:7px;left:7px;width:22px;height:22px;font-size:12px}
  .tkebab{top:7px;left:7px;width:22px;height:22px}
  .tdel svg,.theart svg,.tlater svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tkebab svg{width:14px;height:14px;fill:currentColor;stroke:none}
  .item:hover .tdel,.item:hover .tback,.item:hover .theart,.item:hover .tkebab,.item:hover .tlater{opacity:.7}
  .tdel:hover{opacity:1;background:rgba(150,50,50,.65)}
  .tback:hover,.tkebab:hover{opacity:1;background:rgba(30,32,36,.85)}
  .theart:hover,.tlater:hover{opacity:1}
  .theart.active{color:#ff4d5e}
  .theart.active svg{fill:currentColor}
  .tlater.active{color:#8ec5e0;border-color:rgba(142,197,224,.6)}

  .meta{position:relative;z-index:1;display:flex;align-items:flex-start;gap:8px;margin-top:9px}
  .channel{font-size:12px;color:var(--ink-dim);letter-spacing:.15px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .channel .chlink{color:inherit;text-decoration:none}
  .channel .chlink:hover{text-decoration:underline;color:var(--ink)}
  .title{flex:1;font-size:13.5px;line-height:1.35;color:var(--ink);border-radius:3px;padding:1px 3px;margin:-1px -3px}
  .title:focus{outline:none;background:#26292d}
  .drag{background:none;border:0;color:#5f6367;padding:2px 4px;font-size:14px;line-height:1;cursor:grab;opacity:0;transition:opacity .12s}
  .item:hover .drag{opacity:1}
  .drag:hover{color:var(--ink)}

  .empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;min-height:52vh;padding:40px 20px;
    color:var(--ink-dim);font-size:13px;
  }
  .empty[hidden]{display:none}
  .empty p{margin:0;max-width:56ch;line-height:1.55;opacity:.85;text-wrap:balance}
  .empty .link{
    color:var(--ink);font:inherit;font-size:inherit;padding:0;
    border-bottom:1px solid #4b5157;border-radius:0;
  }
  .empty .link:hover{border-bottom-color:var(--ink)}
  .empty svg{

  var store={
    async get(){
      try{ var r=await window.storage.get(KEY); if(r) return JSON.parse(r.value); }catch(e){}
      try{ var l=localStorage.getItem(KEY); if(l) return JSON.parse(l); }catch(e){}
      return mem;
    },
    async set(v){
      mem=v; var s=JSON.stringify(v);
      try{ await window.storage.set(KEY, s); }catch(e){}
      try{ localStorage.setItem(KEY, s); }catch(e){}
    }
  };

  var state={videos:[], collections:[], active:'all', sort:'manual', cols:5, lang:'en', groupByCollection:true, showHero:true, sidebarCollapsed:false};
  var undo=null;

  function t(k){
    var s=(T[state.lang]&&T[state.lang][k]) || T.en[k] || k;
    for(var i=1;i<arguments.length;i++) s=s.replace('{'+(i-1)+'}', arguments[i]);
    return s;
  }

  var grid=document.getElementById('grid');
  var side=document.getElementById('side');
  var emptyEl=document.getElementById('empty');
  var urlInput=document.getElementById('url');
  var zoomDown=document.getElementById('zoomdown');
  var zoomUp=document.getElementById('zoomup');
  var COLS_MIN=2, COLS_MAX=8;
  var luckyBtn=document.getElementById('lucky');
  var emptyTrashBtn=document.getElementById('emptytrash');
  var backdrop=document.getElementById('backdrop');

  function parseId(s){
    s=(s||'').trim();
    var m=s.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    if(m) return m[1];
    if(/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
    return null;
  }

  async function fetchMeta(id){
    var u='https://www.youtube.com/watch?v='+id;
    try{
      var r=await fetch('https://www.youtube.com/oembed?url='+encodeURIComponent(u)+'&format=json');
      if(r.ok){ var j=await r.json(); if(j.title) return {title:j.title, channel:j.author_name||'', channelUrl:j.author_url||''}; }
    }catch(e){}
    try{
      var r2=await fetch('https://noembed.com/embed?url='+encodeURIComponent(u));
      if(r2.ok){ var j2=await r2.json(); if(j2.title) return {title:j2.title, channel:j2.author_name||'', channelUrl:j2.author_url||''}; }
    }catch(e){}
    return null;
  }
  function fillMeta(id){
    fetchMeta(id).then(function(m){
      if(!m) return;
      var v=find(id); if(!v) return;
      var ch=false;
      if(v.title===id && m.title){ v.title=m.title; ch=true; }
      if(!v.channel && m.channel){ v.channel=m.channel; ch=true; }
      if(!v.channelUrl && m.channelUrl){ v.channelUrl=m.channelUrl; ch=true; }
      if(ch){ save(); render(); }
    });
  }

  // ---------- search ----------
  // Not part of the saved state: a search is a temporary view, it should
  // never come back on the next visit.
  var query='';
  function searching(){ return query.trim().length>0; }
  // Fold case and accents, so "cafe" also finds "caf\u00e9".
  function norm(str){
    str=String(str||'').toLowerCase();
    return str.normalize? str.normalize('NFD').replace(/[\u0300-\u036f]/g,'') : str;
  }

  function nVid(n){ return n===1? t('vid1') : t('vidN', n); }
  function nCol(n){ return n===1? t('col1') : t('colN', n); }

  function find(id){ return state.videos.find(function(x){return x.id===id}); }
  function cols(v){ if(!Array.isArray(v.cols)) v.cols=[]; return v.cols; }
  function sortedCols(){
    return state.collections.slice().sort(function(a,b){
      return a.name.localeCompare(b.name, state.lang, {sensitivity:'base'});
    });
  }
  function colName(cid){
    if(cid==='trash') return t('trash');
    if(cid==='all') return t('all');
    if(cid==='fav') return t('favorites');
    if(cid==='later') return t('later');
    var c=state.collections.find(function(x){return x.id===cid});
    return c? c.name : null;
  }
  function daysLeft(v){ return Math.max(0, KEEP - Math.floor((Date.now()-v.trashed)/DAY)); }

  // Reliable tap handling for iOS Safari: taps inside a horizontally
  // scrolling container (our mobile collection strip) sometimes don't
  // fire a plain 'click'. We track touch movement ourselves and, for a
  // real tap (no scroll), call the handler on touchend and suppress the
  // browser's own follow-up click so it doesn't fire twice.
  function bindTap(el, handler){
    var sx=0, sy=0, moved=false;
    el.addEventListener('touchstart', function(e){
      var t=e.touches[0]; sx=t.clientX; sy=t.clientY; moved=false;
    }, {passive:true});
    el.addEventListener('touchmove', function(e){
      var t=e.touches[0];
      if(Math.abs(t.clientX-sx)>10 || Math.abs(t.clientY-sy)>10) moved=true;
    }, {passive:true});
    el.addEventListener('touchend', function(e){
      if(!moved){ e.preventDefault(); handler(e); }
    });
    el.addEventListener('click', handler);
  }

  function visible(){
    var q=norm(query.trim());
    var v=state.videos.filter(function(x){
      // search runs over the whole library, minus the bin
      if(q) return !x.trashed && (norm(x.title).indexOf(q)>=0 || norm(x.channel).indexOf(q)>=0);
      if(state.active==='trash') return !!x.trashed;
      if(x.trashed) return false;
      if(state.active==='fav') return !!x.fav;
      if(state.active==='later') return !!x.later;
      return state.active==='all' || cols(x).indexOf(state.active)>=0;
    });
    var L=state.lang;
    if(state.sort==='az') v.sort(function(a,b){return a.title.localeCompare(b.title,L,{sensitivity:'base'})});
    if(state.sort==='za') v.sort(function(a,b){return b.title.localeCompare(a.title,L,{sensitivity:'base'})});
    if(state.sort==='new') v.sort(function(a,b){return b.added-a.added});
    if(state.sort==='old') v.sort(function(a,b){return a.added-b.added});
    if(!q && state.active==='trash' && state.sort==='manual') v.sort(function(a,b){return b.trashed-a.trashed});
    return v;
  }

  function save(){
    store.set({videos:state.videos, collections:state.collections, active:state.active,
      sort:state.sort, cols:state.cols, lang:state.lang, groupByCollection:state.groupByCollection,
      showHero:state.showHero, sidebarCollapsed:state.sidebarCollapsed});
  }
  function purge(){
    var n=state.videos.length;
    state.videos=state.videos.filter(function(v){ return !(v.trashed && Date.now()-v.trashed > KEEP*DAY); });
    return n!==state.videos.length;
  }

  // ---------- sidebar ----------
  function colRow(id,label,count){
    var el=document.createElement('div');
    el.className='col'+(!searching() && state.active===id?' active':'');
    var n=document.createElement('div');
    n.className='name'; n.textContent=label; el.appendChild(n);
    var side=document.createElement('div');
    side.className='side'; el.appendChild(side);
    var c=document.createElement('span');
    c.className='n'; c.textContent=count||''; side.appendChild(c);

    if(id!=='all' && id!=='trash' && id!=='fav' && id!=='later'){
      n.title=t('rename');
      n.addEventListener('dblclick',function(){
        n.contentEditable='true'; n.focus(); document.getSelection().selectAllChildren(n);
      });
      n.addEventListener('blur',function(){
        n.contentEditable='false';
        var nv=n.textContent.trim();
        var col=state.collections.find(function(x){return x.id===id});
        if(col && nv && nv!==col.name){ col.name=nv; save(); render(); }
        else n.textContent=col?col.name:label;
      });
      n.addEventListener('keydown',function(e){
        if(e.key==='Enter'){ e.preventDefault(); n.blur(); }
        if(e.key==='Escape'){ n.textContent=colName(id); n.blur(); }
      });
      var edit=document.createElement('button');
      edit.className='edit'; edit.title=t('renameTitle');
      edit.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
      bindTap(edit, function(e){ e.stopPropagation(); openColModal(id); });
      side.appendChild(edit);
    }

    bindTap(el, function(){ closeSearch(true); state.active=id; save(); render(); });
    el.addEventListener('dragover',function(e){
      if(e.dataTransfer.types.indexOf('text/plain')<0) return;
      e.preventDefault(); e.dataTransfer.dropEffect='move'; el.classList.add('drop');
    });
    el.addEventListener('dragleave',function(){ el.classList.remove('drop'); });
    el.addEventListener('drop',function(e){
      e.preventDefault(); e.stopPropagation(); el.classList.remove('drop');
      var v=find(e.dataTransfer.getData('text/plain'));
      if(!v) return;
      if(id==='trash'){ v.trashed=Date.now(); note(t('nTrash')); }
      else if(id==='fav'){
        if(v.trashed) delete v.trashed;
        if(v.fav) note(t('nAlready',colName('fav')));
        else{ v.fav=true; note(t('nAdded',colName('fav'))); }
      }
      else if(id==='later'){
        if(v.trashed) delete v.trashed;
        if(v.later) note(t('nAlready',colName('later')));
        else{ v.later=true; note(t('nAdded',colName('later'))); }
      }
      else{
        if(v.trashed) delete v.trashed;
        if(id==='all'){ v.cols=[]; note(t('nOutAll')); }
        else if(cols(v).indexOf(id)<0){ v.cols.push(id); note(t('nAdded',colName(id))); }
        else note(t('nAlready',colName(id)));
      }
      save(); render();
    });
    return el;
  }

  function newColButton(){
    var btn=document.createElement('button');
    btn.className='newcol'; btn.textContent=t('newcol');
    btn.addEventListener('click',function(){
      var inp=document.createElement('input');
      inp.type='text'; inp.id='newname'; inp.placeholder=t('name'); inp.spellcheck=false;
      btn.replaceWith(inp); inp.focus();
      var done=false;
      function commit(val){ if(done) return; done=true; addCollection(val); }
      inp.addEventListener('keydown',function(e){
        if(e.key==='Enter'){ e.preventDefault(); commit(inp.value); }
        if(e.key==='Escape'){ done=true; render(); }
      });
      inp.addEventListener('blur',function(){ commit(inp.value); });
    });
    return btn;
  }
  function divider(){ var d=document.createElement('div'); d.className='divide'; return d; }

  function renderSide(){
    side.innerHTML='';
    var live=state.videos.filter(function(v){return !v.trashed});
    var trashed=state.videos.length-live.length;

    side.appendChild(colRow('all',t('all'), live.length));
    var laterCount=live.filter(function(v){return v.later}).length;
    if(laterCount>0) side.appendChild(colRow('later',t('later'), laterCount));
    var favCount=live.filter(function(v){return v.fav}).length;
    if(favCount>0) side.appendChild(colRow('fav',t('favorites'), favCount));
    side.appendChild(newColButton());

    if(state.collections.length){
      side.appendChild(divider());
      sortedCols().forEach(function(c){
        var n=live.filter(function(v){return cols(v).indexOf(c.id)>=0}).length;
        side.appendChild(colRow(c.id,c.name,n));
      });
    }
    if(trashed>0){
      side.appendChild(divider());
      side.appendChild(colRow('trash',t('trash'), trashed));
    }
  }

  function addCollection(name){
    name=(name||'').trim();
    if(!name){ render(); return; }
    var id='c'+Date.now().toString(36);
    state.collections.push({id:id,name:name});
    state.active=id; save(); render();
  }
  function removeCollection(id){
    var col=state.collections.find(function(x){return x.id===id});
    if(!col) return;
    var members=state.videos.filter(function(v){return cols(v).indexOf(id)>=0}).map(function(v){return v.id});
    undo={run:function(){
      state.collections.push(col);
      members.forEach(function(id){ var v=find(id); if(v && cols(v).indexOf(col.id)<0) v.cols.push(col.id); });
    }};
    state.collections=state.collections.filter(function(x){return x.id!==id});
    state.videos.forEach(function(v){ v.cols=cols(v).filter(function(c){return c!==id}); });
    if(state.active===id) state.active='all';
    save(); render();
    note(t('nColDel',col.name), true);
  }

        document.body.appendChild(ghost);

        setTimeout(function(){ ghost.remove(); },0);
      });
      item.addEventListener('dragend',function(){
        item.classList.remove('dragging');
        [].forEach.call(document.querySelectorAll('.item'),function(c){c.classList.remove('over')});
        [].forEach.call(side.children,function(c){c.classList.remove('drop')});

        if(state.sort!=='manual'||trashView) return;

      item.addEventListener('drop',function(e){
        e.preventDefault(); item.classList.remove('over');
        if(state.sort!=='manual'||trashView) return;
        var from=e.dataTransfer.getData('text/plain');
        if(!from||from===v.id) return;
        var ids=state.videos.map(function(z){return z.id});
        var fi=ids.indexOf(from), ti=ids.indexOf(v.id);
        if(fi<0||ti<0) return;
        var moved=state.videos.splice(fi,1)[0];
        state.videos.splice(ti,0,moved);
        save(); render();
      });

      return item;
    }

    function buildSection(name,items){
      var sec=document.createElement('div'); sec.className='section';

      var g=document.createElement('div'); g.className='grid';
      items.forEach(function(v){ g.appendChild(buildItem(v)); });

        rn.textContent=list.length===1? t('result1') : t('results', list.length);

      list.forEach(function(v){ grid.appendChild(buildItem(v)); });
      return;
    }
    if(state.active==='all' && !trashView && state.collections.length && state.groupByCollection){
      grid.className='sections';
      sortedCols().forEach(function(c){
        var items=list.filter(function(v){ return cols(v).indexOf(c.id)>=0; });

      grid.className='grid';
      list.forEach(function(v){ grid.appendChild(buildItem(v)); });
    }
  }


  // ---------- watch later hero ----------
  // A full-width, auto-advancing band above the grid on "all videos".
  // One slide per watch-later video, crossfaded; the progress bar is driven
  // by requestAnimationFrame so it pauses cleanly instead of drifting.
  var heroEl=document.getElementById('hero');
  var HERO_MS=11000;
  var heroSlides=[], heroBar=null, heroIdx=0, heroElapsed=0, heroLast=0, heroRaf=null, heroPaused=false;

  function heroReduced(){
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  }
  function heroStop(){
    if(heroRaf){ cancelAnimationFrame(heroRaf); heroRaf=null; }
    heroLast=0;
  }
  function heroShow(i){
    if(!heroSlides.length) return;
    heroIdx=(i+heroSlides.length)%heroSlides.length;
    heroSlides.forEach(function(el,k){ el.classList.toggle('on', k===heroIdx); });
    heroElapsed=0; heroLast=0;
    if(heroBar) heroBar.style.transform='scaleX(0)';
  }
  function heroFrame(ts){
    heroRaf=requestAnimationFrame(heroFrame);
    if(!heroLast){ heroLast=ts; return; }
    var dt=ts-heroLast; heroLast=ts;
    // never advance while the user hovers, the player is open, or the tab is hidden
    if(heroPaused || document.hidden || playerBackdrop.classList.contains('on')) return;
    heroElapsed+=dt;
    var p=Math.min(1, heroElapsed/HERO_MS);
    if(heroBar) heroBar.style.transform='scaleX('+p+')';
    if(p>=1) heroShow(heroIdx+1);
  }

  function renderHero(){
    heroStop();
    heroSlides=[]; heroBar=null; heroPaused=false;
    heroEl.innerHTML='';

    var list=state.videos.filter(function(v){ return v.later && !v.trashed; });
    var on = state.showHero!==false && state.active==='all' && !searching() && list.length>0;
    heroEl.hidden=!on;
    if(!on) return;

    var head=document.createElement('div');
    head.className='sectionhead';
    var nm=document.createElement('span'); nm.textContent=t('later'); head.appendChild(nm);
    var cnt=document.createElement('span'); cnt.className='cnt'; cnt.textContent=list.length; head.appendChild(cnt);
    heroEl.appendChild(head);

    var stage=document.createElement('div');
    stage.className='herostage';
    heroEl.appendChild(stage);

    list.forEach(function(v,i){
      var sl=document.createElement('div');
      sl.className='heroslide'+(i===0?' on':'');

      var img=document.createElement('img');
      img.alt=''; img.draggable=false; img.loading = i===0? 'eager' : 'lazy';
      var sizes=['maxresdefault','sddefault','hqdefault','mqdefault'], si=0;
      function nextSrc(){
        if(si>=sizes.length) return;
        img.src='https://i.ytimg.com/vi/'+v.id+'/'+sizes[si++]+'.jpg';
      }
      img.onerror=function(){ nextSrc(); };
      img.onload=function(){
        if(img.naturalWidth<=120 && si<sizes.length) nextSrc();
      };
      nextSrc();
      sl.appendChild(img);

      var shade=document.createElement('div'); shade.className='heroshade'; sl.appendChild(shade);

      var inner=document.createElement('div'); inner.className='heroinner';
      if(v.channel){
        var kick=document.createElement('div');
        kick.className='herokicker'; kick.textContent=v.channel;
        inner.appendChild(kick);
      }
      var ttl=document.createElement('div');
      var len=(v.title||'').length;
      ttl.className='herotitle '+(len<=34?'s1':len<=62?'s2':len<=105?'s3':'s4');
      ttl.textContent=v.title;
      inner.appendChild(ttl);
      sl.appendChild(inner);

      stage.appendChild(sl);
      heroSlides.push(sl);
    });

    bindTap(stage, function(){
      var v=list[heroIdx];
      if(v) openYT(v);
    });

    if(list.length>1){
      var prev=document.createElement('button');
      prev.className='heronav prev'; prev.title=t('heroPrev'); prev.setAttribute('aria-label', t('heroPrev'));
      prev.innerHTML='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
      bindTap(prev, function(e){ e.stopPropagation(); heroShow(heroIdx-1); });
      stage.appendChild(prev);

      var next=document.createElement('button');
      next.className='heronav next'; next.title=t('heroNext'); next.setAttribute('aria-label', t('heroNext'));
      next.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
      bindTap(next, function(e){ e.stopPropagation(); heroShow(heroIdx+1); });
      stage.appendChild(next);

      var prog=document.createElement('div');
      prog.className='heroprog';
      heroBar=document.createElement('i');
      prog.appendChild(heroBar);
      heroEl.appendChild(prog);

      stage.addEventListener('mouseenter',function(){ heroPaused=true; });
      stage.addEventListener('mouseleave',function(){ heroPaused=false; heroLast=0; });

      if(!heroReduced()) heroRaf=requestAnimationFrame(heroFrame);
    }
  }

  // ---------- random numbers ----------
  function randomFloat(){
    if(window.crypto && crypto.getRandomValues){
      var buf=new Uint32Array(1);
      crypto.getRandomValues(buf);
      return buf[0]/4294967296;
    }
    return Math.random();
  }
  function pickRandom(list){
    return list[Math.floor(randomFloat()*list.length)];
  }

  });

  // ---------- rename collection ----------
  var colBackdrop=document.getElementById('colbackdrop');
  var colInput=document.getElementById('colm-input');
  var colDeleteBtn=document.getElementById('colm-delete');
  var colSaveBtn=document.getElementById('colm-save');
  var editingColId=null;

  function openColModal(id){
    editingColId=id;
    document.getElementById('colm-title').textContent=t('renameTitle');
    colSaveBtn.textContent=t('save');
    colDeleteBtn.textContent=t('deleteColBtn');
    var col=state.collections.find(function(c){return c.id===id});
    colInput.value=col?col.name:'';
    colBackdrop.classList.add('on');
    colInput.focus(); colInput.select();
  }
  function closeColModal(){ colBackdrop.classList.remove('on'); editingColId=null; }
  function saveColName(){
    var nv=colInput.value.trim();
    var col=state.collections.find(function(c){return c.id===editingColId});
    if(col && nv && nv!==col.name){ col.name=nv; save(); render(); }
    closeColModal();
  }
  colSaveBtn.addEventListener('click',saveColName);
  colInput.addEventListener('keydown',function(e){
    if(e.key==='Enter'){ e.preventDefault(); saveColName(); }
    if(e.key==='Escape'){ e.stopPropagation(); closeColModal(); }
  });
  colDeleteBtn.addEventListener('click',function(){
    var id=editingColId; closeColModal(); removeCollection(id);
  });
  document.getElementById('colm-x').addEventListener('click',closeColModal);
  colBackdrop.addEventListener('click',function(e){ if(e.target===colBackdrop) closeColModal(); });

  // ---------- add to collections ----------
  var addColsBackdrop=document.getElementById('addcolsbackdrop');
  var addColsList=document.getElementById('addcols-list');
  var addColsSaveBtn=document.getElementById('addcols-save');
  var addColsVideoId=null;
  var addColsPending=[];

  function openAddColsModal(id){
    addColsVideoId=id;
    var v=find(id); if(!v) return;
    addColsPending=cols(v).slice();
    document.getElementById('addcols-title').textContent=t('addToCols');
    addColsSaveBtn.textContent=t('save');
    renderAddColsList();
    addColsBackdrop.classList.add('on');
  }
  function closeAddColsModal(){ addColsBackdrop.classList.remove('on'); addColsVideoId=null; }
  function renderAddColsList(){
    addColsList.innerHTML='';
    var list=sortedCols();
    if(!list.length){
      var p=document.createElement('p');
      p.className='about'; p.textContent=t('noColsYet');
      addColsList.appendChild(p);
      return;
    }
    list.forEach(function(c){
      var row=document.createElement('button');
      row.className='opt'+(addColsPending.indexOf(c.id)>=0?' sel':'');
      row.innerHTML='<span class="tick">✓</span><span></span>';
      row.lastChild.textContent=c.name;
      bindTap(row, function(){
        var i=addColsPending.indexOf(c.id);
        if(i>=0) addColsPending.splice(i,1); else addColsPending.push(c.id);
        row.classList.toggle('sel');
      });
      addColsList.appendChild(row);
    });
  }
  function saveAddCols(){
    var v=find(addColsVideoId);
    if(v) v.cols=addColsPending.slice();
    save(); closeAddColsModal(); render();
  }
  addColsSaveBtn.addEventListener('click', saveAddCols);
  document.getElementById('addcols-x').addEventListener('click', closeAddColsModal);
  addColsBackdrop.addEventListener('click', function(e){ if(e.target===addColsBackdrop) closeAddColsModal(); });

  var headerEl=document.querySelector('header');
  function onScroll(){ headerEl.classList.toggle('stuck', window.scrollY>4); }
  window.addEventListener('scroll',onScroll,{passive:true});
  onScroll();
  document.getElementById('m-close').addEventListener('click',closeModal);
  document.getElementById('m-x').addEventListener('click',closeModal);
  backdrop.addEventListener('click',function(e){ if(e.target===backdrop) closeModal(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeImportModal(); closeModal(); closePlayer(); closeColModal(); closeAddColsModal(); closeSearch(); } });

  // ---------- notification ----------
  var noteEl=null, noteTimer=null;
  function note(msg, withUndo){
    if(noteEl) noteEl.remove();
    clearTimeout(noteTimer);
    if(!msg){ noteEl=null; return; }
    noteEl=document.createElement('div');
    noteEl.className='note'; noteEl.textContent=msg;
    if(withUndo && undo){
      var b=document.createElement('button');
      b.textContent=t('undo');
      b.addEventListener('click',function(){
        if(!undo) return;
        var fn=undo.run, after=undo.note; undo=null;
        fn(); save(); render();
        note(after||'');
      });
      noteEl.appendChild(b);
    }
    document.body.appendChild(noteEl);
    noteTimer=setTimeout(function(){ if(noteEl){noteEl.remove(); noteEl=null;} }, 7000);
  }

  // ---------- add ----------
  async function add(text){
    var parts=(text||'').split(/[\s,]+/).filter(Boolean);
    var ids=[], bad=0;
    parts.forEach(function(p){
      var id=parseId(p);
      if(!id){ bad++; return; }
      var ex=find(id);
      if(ex){ if(ex.trashed){ delete ex.trashed; save(); render(); note(t('nUntrash')); } return; }
      if(ids.indexOf(id)<0) ids.push(id);
    });
    if(!ids.length){ if(bad) note(t('nBadUrl')); return; }
    var now=Date.now();
    var target=(state.active==='all'||state.active==='trash') ? [] : [state.active];
    ids.forEach(function(id,i){
      state.videos.push({id:id, title:id, channel:'', cols:target.slice(), added:now+i});
    });
    if(state.active==='trash') state.active='all';
    save(); render();
    ids.forEach(fillMeta);
  }

  urlInput.addEventListener('keydown',function(e){ if(e.key==='Enter'){ add(urlInput.value); urlInput.value=''; } });

  // ---------- search field ----------
  var searchWrap=document.getElementById('searchwrap');
  var searchInput=document.getElementById('search');
  var searchTimer=null;
  function openSearch(){
    searchWrap.classList.add('open');
    setTimeout(function(){ searchInput.focus(); },10);
  }
  function closeSearch(silent){
    clearTimeout(searchTimer);
    searchWrap.classList.remove('open');
    searchInput.value='';
    var had=searching();
    query='';
    if(had && !silent) render();
  }
  bindTap(document.getElementById('searchbtn'), function(e){
    e.stopPropagation();
    if(!searchWrap.classList.contains('open')) openSearch();
    else if(!searchInput.value) closeSearch();
    else searchInput.focus();
  });
  bindTap(document.getElementById('searchx'), function(e){
    e.stopPropagation(); closeSearch();
  });
  searchInput.addEventListener('input',function(){
    clearTimeout(searchTimer);
    searchTimer=setTimeout(function(){
      query=searchInput.value;
      render();
    },140);
  });
  searchInput.addEventListener('keydown',function(e){
    if(e.key==='Escape'){ e.stopPropagation(); closeSearch(); }
  });
  urlInput.addEventListener('paste',function(e){
    var txt=(e.clipboardData||window.clipboardData).getData('text');
    if(txt && parseId(txt)){ e.preventDefault(); add(txt); urlInput.value=''; }
  });
  function changeCols(delta){
    var nv=Math.max(COLS_MIN, Math.min(COLS_MAX, state.cols+delta));
    if(nv===state.cols) return;
    state.cols=nv;
    document.documentElement.style.setProperty('--cols', state.cols);
    updateZoomDisabled();
    save();
  }
  document.getElementById('zoomdown').addEventListener('click', function(){ changeCols(1); });  // - = smaller cards = more columns
  document.getElementById('zoomup').addEventListener('click', function(){ changeCols(-1); });   // + = bigger cards = fewer columns
  emptyTrashBtn.addEventListener('click',function(){
    var n=state.videos.filter(function(v){return v.trashed}).length;
    state.videos=state.videos.filter(function(v){return !v.trashed});
    save(); render(); note(t('nPurged',n));
  });

  // ---------- export / import ----------
  document.getElementById('m-export').addEventListener('click',function(){
    var data={
      app:'video-gallery', version:FORMAT, exported:new Date().toISOString(),
      collections:state.collections,
      // Column count and the sidebar state stay on the device: what suits a
      // wide monitor is wrong on an iPad Mini.
      settings:{sort:state.sort, lang:state.lang,
        groupByCollection:!!state.groupByCollection, showHero:state.showHero!==false},
      // Copy the whole video, so a field a newer version added survives a
      // round trip through an older build instead of being silently dropped.
      videos:state.videos.map(function(v){
        var o=Object.assign({}, v);
        o.cols=cols(v).slice();
        return o;
      })
    };
    var jsonStr=JSON.stringify(data,null,2);
    var filename='video-gallery-'+new Date().toISOString().slice(0,10)+'.json';

    function fallbackDownload(){
      try{
        var blob=new Blob([jsonStr],{type:'application/json'});
        var url=URL.createObjectURL(blob);
        var a=document.createElement('a');
        a.href=url; a.download=filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); },2000);
        closeModal();
        note(t('nExport', nVid(data.videos.length), nCol(data.collections.length)));
      }catch(e){ note(t('nExportFail')); }
    }

    // On iPad/iPhone this opens the native share sheet, so "Save to Files"
    // can drop the backup straight into an iCloud Drive folder.
    // Requires https (or localhost) - falls back to a plain download otherwise.
    try{
      var file=new File([jsonStr], filename, {type:'application/json'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:filename}).then(function(){
          closeModal();
          note(t('nExport', nVid(data.videos.length), nCol(data.collections.length)));
        }).catch(function(err){
          if(err && err.name==='AbortError') return; // user cancelled the share sheet
          fallbackDownload();
        });
        return;
      }
    }catch(e){}
    fallbackDownload();
  });

  var importInput=document.getElementById('importfile');
  document.getElementById('m-import').addEventListener('click',function(){ importInput.click(); });
  importInput.addEventListener('change',function(){
    var f=importInput.files && importInput.files[0];
    if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      try{ askImport(JSON.parse(rd.result)); }catch(e){ note(t('nUnread')); }
      importInput.value='';
    };
    rd.readAsText(f);
  });

  // Restoring a backup replaces everything, so it always asks first and
  // stays undoable afterwards.
  var impBackdrop=document.getElementById('impbackdrop');
  var pendingImport=null;

  function closeImportModal(){ impBackdrop.classList.remove('on'); pendingImport=null; }

  function askImport(data){
    if(!data || !Array.isArray(data.videos)){ note(t('nBadFile')); return; }
    pendingImport=data;
    var nv=data.videos.filter(function(v){ return v && v.id; }).length;
    var nc=(data.collections||[]).filter(function(c){ return c && c.id && c.name; }).length;

    document.getElementById('impm-title').textContent=t('impTitle');
    document.getElementById('impm-file').textContent=t('impFile', nVid(nv), nCol(nc));

    var made=document.getElementById('impm-made');
    var d=data.exported? new Date(data.exported) : null;
    if(d && !isNaN(d.getTime())){
      made.hidden=false;
      made.textContent=t('impMade',
        d.toLocaleDateString(state.lang, {day:'numeric', month:'long', year:'numeric'})
        + ' ' + d.toLocaleTimeString(state.lang, {hour:'numeric', minute:'2-digit'}));
    } else made.hidden=true;

    document.getElementById('impm-now').textContent=
      t('impNow', nVid(state.videos.length), nCol(state.collections.length));

    var warn=document.getElementById('impm-warn');
    warn.hidden=!(typeof data.version==='number' && data.version>FORMAT);
    if(!warn.hidden) warn.textContent=t('impNewer');

    document.getElementById('impm-cancel').textContent=t('cancel');
    document.getElementById('impm-go').textContent=t('impGo');
    impBackdrop.classList.add('on');
  }

  function merge(data){
    if(!data || !Array.isArray(data.videos)){ note(t('nBadFile')); return; }

    // snapshot for undo, taken before anything is touched
    var prev={
      videos:JSON.parse(JSON.stringify(state.videos)),
      collections:JSON.parse(JSON.stringify(state.collections)),
      active:state.active, sort:state.sort, lang:state.lang,
      groupByCollection:state.groupByCollection, showHero:state.showHero
    };

    state.collections=(data.collections||[])
      .filter(function(c){ return c && c.id && c.name; })
      .map(function(c){ return {id:c.id, name:c.name}; });
    var validCols=state.collections.map(function(c){return c.id;});
    state.videos=data.videos.filter(function(v){ return v && v.id; }).map(function(v){
      // keep every field the file carries, then normalise the ones we know
      var o=Object.assign({}, v);
      o.id=v.id;
      o.title=v.title||v.id;
      o.channel=v.channel||'';
      o.channelUrl=v.channelUrl||'';
      o.cols=(v.cols||[]).filter(function(c){ return validCols.indexOf(c)>=0; });
      o.added=v.added||Date.now();
      delete o.col;
      if(!o.trashed) delete o.trashed;
      if(!o.fav) delete o.fav;
      if(!o.later) delete o.later;
      return o;
    });

    var st=data.settings;
    if(st && typeof st==='object'){
      if(['az','za','new','old','manual'].indexOf(st.sort)>=0) state.sort=st.sort;
      if(st.lang && T[st.lang]) state.lang=st.lang;
      if(typeof st.groupByCollection==='boolean') state.groupByCollection=st.groupByCollection;
      if(typeof st.showHero==='boolean') state.showHero=st.showHero;
    }

    if(state.active!=='all' && state.active!=='trash' && state.active!=='fav' && state.active!=='later' && validCols.indexOf(state.active)<0){
      state.active='all';
    }

    undo={run:function(){
      state.videos=prev.videos; state.collections=prev.collections;
      state.active=prev.active; state.sort=prev.sort; state.lang=prev.lang;
      state.groupByCollection=prev.groupByCollection; state.showHero=prev.showHero;
    }, note:t('nImportUndone')};

    save(); closeImportModal(); closeModal(); render();
    state.videos.forEach(function(v){ if(!v.channel || v.title===v.id || !v.channelUrl) fillMeta(v.id); });
    note(t('nImport', nVid(state.videos.length), nCol(state.collections.length)), true);
  }

  document.getElementById('impm-go').addEventListener('click',function(){
    if(pendingImport) merge(pendingImport);
  });
  document.getElementById('impm-cancel').addEventListener('click',closeImportModal);
  document.getElementById('impm-x').addEventListener('click',closeImportModal);
  impBackdrop.addEventListener('click',function(e){ if(e.target===impBackdrop) closeImportModal(); });

  (async function init(){
    var saved=await store.get();
    if(saved && saved.videos){ state=Object.assign(state,saved); }
    if(saved && saved.size && !saved.cols){
      state.cols=Math.max(COLS_MIN, Math.min(COLS_MAX, Math.round(1440/saved.size)));
    }
    if(!state.collections) state.collections=[];
    if(!T[state.lang]) state.lang='en';
    state.videos.forEach(function(v){
      if(!Array.isArray(v.cols)) v.cols = v.col ? [v.col] : [];
      delete v.col;
    });
    if(purge()) save();
    render();
    if(SEED.length){
      var before=state.active; state.active='all';
      await add(SEED.join(' '));
      state.active=before; render();
    }
    state.videos.forEach(function(v){ if(!v.channel || v.title===v.id || !v.channelUrl) fillMeta(v.id); });
  })();
})();
</script>
</body>
</html>
