<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT-Playlists • Organise your favourite YouTube videos</title>
<meta name="description" content="A quiet, ad-free way to collect and organise your favourite YouTube videos in your own lists and folders. Free.">
<meta property="og:title" content="YT Playlists">
<meta property="og:description" content="Collect and organise your favourite YouTube videos in your own lists and folders. Free.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FF0034'/%3E%3Cpath d='M11.5 8v16l13-8z' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --bg:#17181a;
    --panel:#1f2124;
    --line:#2c2f33;
    --ink:#f2f1ee;
    --ink-dim:#9a9c9f;
    --focus:#7ea6c4;
    --cols:5;
    --radius:4px;
    --thumb-radius:calc(56px / var(--cols));
    --nav-h:66px;
    --aside-w:240px;
  }
  *{box-sizing:border-box}
  html{scrollbar-gutter:stable;overflow-y:scroll}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1700px;margin:0 auto;padding:0 28px 80px}

  header{
    position:sticky;top:0;z-index:40;
    background:transparent;transition:background-color .2s ease;
  }
  header.stuck{
    background:rgba(23,24,26,.55);
    backdrop-filter:blur(18px) saturate(1.4);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    header.stuck{background:rgba(23,24,26,.94)}
  }
  .navinner{
    position:relative;max-width:1700px;margin:0 auto;padding:16px 28px;
    display:flex;gap:6px 16px;align-items:center;flex-wrap:wrap;
    height:var(--nav-h);font-size:12.5px;color:var(--ink-dim);
  }
  header:hover, header:focus-within{color:#c6c8cb}
  .logo{
    flex:0 0 var(--aside-w);width:var(--aside-w);margin-right:16px;
    display:flex;align-items:center;gap:9px;overflow:hidden;
    font-size:13.5px;font-weight:400;color:var(--ink);letter-spacing:.1px;
  }
  .logo:hover{color:var(--ink)}
  .logoicon{
    width:20px;height:20px;flex:none;fill:none;stroke:#6f8fb8;stroke-width:1.3;
    stroke-linecap:round;stroke-linejoin:round;opacity:.95;
    animation:iconglow 14s ease-in-out infinite;
  }
  .logotext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (hover:hover) and (pointer:fine){
    .logo:hover .logotext{
      background:linear-gradient(90deg,#ff5f6d,#ffc371,#7afcff,#7a86ff,#ff5fd8,#ff5f6d);
      background-size:300% 100%;
      -webkit-background-clip:text;background-clip:text;color:transparent;
      animation:pillshift 3s linear infinite;
    }
    .logo:hover .logoicon{
      animation:logoiconglow 2.2s ease-in-out infinite;
    }
  }
  @keyframes logoiconglow{
    0%,100%{stroke:#ff5f6d;filter:drop-shadow(0 0 6px rgba(255,95,109,.65))}
    20%{stroke:#ffc371;filter:drop-shadow(0 0 6px rgba(255,195,113,.65))}
    40%{stroke:#7afcff;filter:drop-shadow(0 0 6px rgba(122,252,255,.65))}
    60%{stroke:#7a86ff;filter:drop-shadow(0 0 6px rgba(122,134,255,.65))}
    80%{stroke:#ff5fd8;filter:drop-shadow(0 0 6px rgba(255,95,216,.65))}
  }
  @media (prefers-reduced-motion:reduce){ .logo:hover .logotext, .logo:hover .logoicon{animation:none} }
  body.sidebar-collapsed .logo{flex-basis:var(--aside-w);width:var(--aside-w);justify-content:center}
  body.sidebar-collapsed .logotext{display:none}
  .sep{flex:1}
  .tools{display:flex;align-items:center;gap:14px}

  input[type=text]{
    background:transparent;border:0;color:var(--ink);
    font:inherit;font-size:12.5px;padding:3px 0;
  }
  input[type=text]::placeholder{color:#7c7f83}

  #url:hover::placeholder,#url:focus::placeholder{color:#a7a9ac}

  #newname{border-bottom:1px solid transparent;width:100%;transition:border-color .18s ease}
  #newname:hover,#newname:focus{outline:none;border-bottom-color:var(--line)}

  .addwrap{
    padding:1px;border-radius:999px;
    background:linear-gradient(90deg,#3d4a5a,#4b4059,#37514c,#4a4553,#3d4a5a);
    background-size:400% 100%;
    animation:pillshift 18s linear infinite;
    transition:box-shadow .2s ease;
  }
  @keyframes pillshift{from{background-position:0% 50%}to{background-position:400% 50%}}
  .addwrap:focus-within{background-size:250% 100%;animation-duration:9s}
  .addwrap:hover{background-size:250% 100%;animation-duration:9s;box-shadow:0 0 0 1px rgba(255,255,255,.3),0 0 18px rgba(126,166,196,.4)}
  #url{
    display:block;background:rgba(23,24,26,.72);border-radius:999px;
    padding:6px 16px;width:320px;
    transition:width .2s ease, background-color .2s ease;
  }
  #url:hover{background:rgba(48,51,56,.9);width:480px}
  #url:focus{outline:none;background:rgba(48,51,56,.9);width:480px}
  @media (prefers-reduced-motion:reduce){ .addwrap{animation:none} }


  /* ---------- search ---------- */
  .searchwrap{flex:none}
  .circwrap{display:contents}
  #addbtn{display:none}
  .searchbox{
    display:flex;align-items:center;overflow:hidden;
    background:rgba(23,24,26,.72);border-radius:999px;
    height:30px;width:30px;
    transition:width .22s ease, background-color .2s ease;
  }
  .searchbox:hover{background:rgba(48,51,56,.9)}
  .searchwrap.open .searchbox{width:300px;background:rgba(48,51,56,.9)}
  .searchico{
    flex:none;width:30px;height:30px;display:grid;place-items:center;
    padding:0;color:var(--ink);
  }
  .searchico svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #search{display:none;flex:1;min-width:0;width:100%;padding:0 2px}
  #search:focus{outline:none}
  .searchwrap.open #search{display:block}
  .searchx{
    flex:none;width:30px;height:30px;display:none;place-items:center;
    padding:0;color:var(--ink-dim);
  }
  .searchwrap.open .searchx{display:grid}
  .searchx:hover{color:var(--ink)}
  .searchx svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  .incols{font-size:11px;color:var(--ink-dim);opacity:.72;margin-top:3px;line-height:1.35}
  @media (max-width:1100px){ .searchwrap.open .searchbox{width:200px} }

  .luckywrap{flex:none}
  .luckybtn{
    display:block;background:rgba(23,24,26,.72);border-radius:999px;
    padding:6px 18px;font:inherit;font-size:12.5px;color:var(--ink);
    white-space:nowrap;transition:background-color .2s ease;
  }
  .luckybtn:hover{background:rgba(48,51,56,.9)}
  @media (hover:hover) and (pointer:fine){
    .luckywrap:hover{
      background:linear-gradient(90deg,#ff5f6d,#ffc371,#7afcff,#7a86ff,#ff5fd8,#ff5f6d);
      background-size:300% 100%;
      animation:pillshift 3s linear infinite, luckyglow 2.2s ease-in-out infinite;
    }
  }
  @keyframes luckyglow{
    0%,100%{box-shadow:0 0 18px 2px rgba(255,95,109,.45)}
    20%{box-shadow:0 0 18px 2px rgba(255,195,113,.45)}
    40%{box-shadow:0 0 18px 2px rgba(122,252,255,.45)}
    60%{box-shadow:0 0 18px 2px rgba(122,134,255,.45)}
    80%{box-shadow:0 0 18px 2px rgba(255,95,216,.45)}
  }
  @media (prefers-reduced-motion:reduce){ .luckywrap:hover{animation:none} }

  button{-webkit-appearance:none;appearance:none;background:none;border:0;color:inherit;font:inherit;font-size:12.5px;padding:3px 2px;cursor:pointer;border-radius:2px}
  button:hover{color:var(--ink)}
  input[type=range]{display:none}
  #emptytrash{display:none;color:var(--ink-dim)}
  #emptytrash.on{display:inline}
  .icon{display:inline-grid;place-items:center;padding:2px;color:var(--ink-dim);opacity:.75}
  .icon:hover{opacity:1;color:var(--ink)}
  .icon:disabled{opacity:.3;pointer-events:none}
  .icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  #gear svg{transition:transform .35s ease}
  #gear:hover svg{transform:rotate(180deg)}
  :focus-visible{outline:1px solid var(--focus);outline-offset:3px}

  /* collections */
  .body{display:flex;gap:32px;align-items:flex-start}
  aside{
    position:fixed;top:var(--nav-h);
    left:calc(28px + max(0px, (100vw - 1700px) / 2));
    width:var(--aside-w);
    /* iOS reports 100vh as the height WITHOUT the retractable browser bars,
       so on iPad the bottom of this fixed panel (and with it the collapse
       button) sits below the visible area. dvh follows the real viewport. */
    height:calc(100vh - var(--nav-h));
    height:calc(100dvh - var(--nav-h));
    z-index:30;transition:width .18s ease;
    display:flex;flex-direction:column;
  }
  aside::before{
    content:'';position:absolute;inset:0;z-index:-1;
    background:rgba(23,24,26,.55);
    backdrop-filter:blur(18px) saturate(1.4);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
    -webkit-mask-image:linear-gradient(to right, black 0%, black 75%, transparent 100%);
    mask-image:linear-gradient(to right, black 0%, black 75%, transparent 100%);
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    aside::before{background:rgba(23,24,26,.94);-webkit-mask-image:none;mask-image:none}
  }
  #side{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:4px;
    -webkit-overflow-scrolling:touch;
    font-size:12.5px;color:var(--ink-dim);
    scrollbar-width:none;-ms-overflow-style:none;
  }
  #side::-webkit-scrollbar{display:none}
  .sidetoggle{
    flex:none;margin-top:auto;padding-top:12px;margin-bottom:20px;
    display:flex;align-items:center;gap:8px;width:calc(100% + 12px);margin-left:-6px;
    padding-left:6px;padding-right:6px;padding-bottom:7px;
    border-radius:3px;color:var(--ink-dim);font-size:12.5px;text-align:left;
  }
  .sidetoggle:hover{color:var(--ink)}
  .sidetoggle svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s ease}
  .sidetoggle .lbl{white-space:nowrap;overflow:hidden}
  aside.collapsed{align-items:center}
  aside.collapsed #side{display:none}
  aside.collapsed .sidetoggle{
    width:28px;height:28px;margin-left:0;padding:0;justify-content:center;
    border:1px solid var(--line);border-radius:50%;
  }
  aside.collapsed .sidetoggle:hover{border-color:#4d525a}
  aside.collapsed .sidetoggle svg{transform:rotate(180deg)}
  aside.collapsed .sidetoggle .lbl{display:none}
  .col{position:relative;display:flex;align-items:center;gap:8px;padding:4px 6px;margin:0 -6px;border-radius:3px;cursor:pointer;user-select:none}
  /* hover picks up the same rainbow sweep as the logo, no background, no rule */
  .col:hover{color:#c6c8cb}
  @media (hover:hover) and (pointer:fine){
    .col:hover .name{
      font-weight:600;
      background:linear-gradient(90deg,#ff5f6d,#ffc371,#7afcff,#7a86ff,#ff5fd8,#ff5f6d);
      background-size:300% 100%;
      -webkit-background-clip:text;background-clip:text;color:transparent;
      animation:pillshift 3s linear infinite;
    }
    /* while renaming in place the text has to stay readable */
    .col:hover .name[contenteditable="true"]:focus{
      font-weight:400;background:#2a2d31;color:var(--ink);
      -webkit-text-fill-color:var(--ink);animation:none;
    }
  }
  @media (prefers-reduced-motion:reduce){ .col:hover .name{animation:none} }
  .col.active{color:var(--focus)}
  .col.active .n{opacity:.6}
  .col.drop{background:#25282c;box-shadow:inset 2px 0 0 var(--focus);color:var(--ink)}
  .col .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .col .name[contenteditable="true"]:focus{outline:none;background:#2a2d31;border-radius:2px;padding:0 2px;text-overflow:clip}
  .col .side{position:relative;flex:0 0 auto;width:18px;height:16px}
  .col .n{
    position:absolute;top:0;right:0;line-height:16px;
    font-size:11px;opacity:.45;font-variant-numeric:tabular-nums;
    text-align:right;transition:opacity .12s;
  }
  .col:hover .n{opacity:0}
  .col .edit{
    position:absolute;top:50%;right:-3px;margin-top:-11px;
    border:0;background:none;color:inherit;
    cursor:pointer;padding:0;width:22px;height:22px;display:inline-grid;place-items:center;opacity:0;
  }
  .col .edit svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .col:hover .edit{opacity:.6}
  .col .edit:hover{opacity:1;color:var(--ink)}
  /* every row reserves this slot, empty or not, so all the labels in the
     sidebar start on the same vertical line */
  .col .ico{
    flex:none;width:17px;display:grid;place-items:center;
    font-size:13px;line-height:1;
  }
  .col .ico svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  /* a list inside a folder lines up under the folder name, with a hairline
     running down the group so the nesting reads without an arrow */
  .col.sub{position:relative}
  .col.sub::before{content:'';position:absolute;left:14px;top:0;bottom:0;width:1px;background:var(--line);opacity:.9}
  .col.sub.lastsub::before{bottom:50%}
  /* line the two buttons up with the labels, not with the row edge */
  .newrow{display:flex;align-items:center;gap:12px;margin:0 -6px;padding:0 6px 0 31px}
  .newrow .newcol{width:auto;flex:none;margin:0;padding:4px 0}
  .newrow.editing .newcol{display:none}
  .newrow #newname{flex:1;min-width:0}
  .fmrow{display:flex;gap:8px;align-items:center}
  .fmrow input.colinput{margin-bottom:0}
  .fmrow #fm-search{flex:1;min-width:0}
  .fmrow #fm-own{width:74px;flex:none;text-align:center;font-size:15px}
  .icongrid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px;
    max-height:196px;overflow-y:auto;padding:2px;margin-top:8px;
  }
  .iconbtn{
    display:grid;place-items:center;width:100%;aspect-ratio:1;padding:0;
    border:1px solid transparent;border-radius:6px;color:var(--ink-dim);
  }
  .iconbtn:hover{background:#26292d;color:var(--ink)}
  .iconbtn.sel{border-color:var(--focus);color:var(--focus);background:#22262b}
  .iconbtn{font-size:19px;line-height:1}
  /* the browser's own tooltip pops up within a second and gets in the way,
     so this one waits and we control it */
  .tip{
    position:fixed;z-index:90;pointer-events:none;
    background:#2a2d31;border:1px solid var(--line);border-radius:4px;
    padding:5px 9px;font-size:12px;color:var(--ink);white-space:nowrap;
    box-shadow:0 6px 18px rgba(0,0,0,.45);opacity:0;transition:opacity .12s ease;
  }
  .tip.on{opacity:1}
  .divide{height:1px;background:var(--line);margin:10px -6px 8px;opacity:.6}
  .newcol{opacity:.5;padding:4px 6px;margin:0 -6px;display:block;text-align:left;width:calc(100% + 12px)}
  .newcol:hover{opacity:1}
  #newname{width:100%}
  #newname:focus{width:100%;border-bottom-color:var(--line)}
  /* input[type=text] is more specific than a bare class, so name the element */
  input.colinput,select.colinput{
    display:block;width:100%;background:#1c1e21;border:1px solid var(--line);
    border-radius:4px;padding:8px 10px;color:var(--ink);font:inherit;font-size:13px;
    margin-bottom:20px;
  }
  input.colinput:focus,select.colinput:focus{outline:none;border-color:var(--focus)}
  .btn-danger{color:#c98686}

  .btn-danger:hover{color:#e08a8a}

  main{
    flex:1;min-width:0;
    margin-left:calc(var(--aside-w) + 32px);
  }
  .grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:26px 20px}
  .sections{display:block}
  .section{margin-bottom:44px}
  .section:last-child{margin-bottom:0}
  .sectionhead{display:flex;align-items:baseline;gap:8px;margin:0 0 12px;font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.2px}
  .sectionhead .cnt{font-size:11px;font-weight:400;color:var(--ink-dim);opacity:.55;font-variant-numeric:tabular-nums}
  .sectiondivide{height:1px;background:var(--line);margin:0 0 20px;opacity:.7}
  .section:first-child .sectionhead{margin-top:4px}

  /* ---------- watch later hero ---------- */
  .hero{margin:0 0 40px}
  .herostage{
    position:relative;width:100%;
    height:min(54vh, calc((100vw - var(--aside-w) - 64px) * 0.5625));
    min-height:180px;
    /* exactly the thumbnail radius, so the hero grows and shrinks its
       corners along with the grid below when the column count changes */
    border-radius:var(--thumb-radius);overflow:hidden;background:#000;cursor:pointer;
  }
  .heroslide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease-in-out;pointer-events:none}
  .heroslide.on{opacity:1}
  .heroslide img{width:100%;height:100%;object-fit:cover;display:block}
  .heroshade{
    position:absolute;inset:0;
    background:linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,.55) 30%,rgba(0,0,0,.08) 64%,rgba(0,0,0,.35) 100%);
  }
  .heroinner{
    position:absolute;left:clamp(18px,3.4vw,48px);right:clamp(18px,3.4vw,48px);
    bottom:clamp(16px,3.4vh,40px);max-width:1100px;
  }
  .herokicker{
    font-size:11px;letter-spacing:.26em;text-transform:uppercase;
    color:rgba(255,255,255,.6);margin-bottom:clamp(7px,1.4vh,14px);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  /* Magazine-style headline. Tight tracking and a sub-1 line-height need the
     padding/margin trick below, otherwise overflow:hidden clips the tails of
     g, j and p on the last visible line. */
  .herotitle{
    font-family:"Helvetica Neue",Helvetica,Inter,Arial,sans-serif;
    font-weight:700;line-height:.94;letter-spacing:-.035em;color:#fff;margin:0;
    text-wrap:balance;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;
    padding-bottom:.14em;margin-bottom:-.14em;
  }
  .herotitle.s1{font-size:clamp(2rem,5vw,4.2rem)}
  .herotitle.s2{font-size:clamp(1.7rem,3.7vw,3.1rem)}
  .herotitle.s3{font-size:clamp(1.4rem,2.6vw,2.2rem);line-height:1;letter-spacing:-.025em}
  .herotitle.s4{font-size:clamp(1.15rem,1.9vw,1.65rem);line-height:1.06;letter-spacing:-.015em;-webkit-line-clamp:4}
  .heronav{
    position:absolute;top:50%;margin-top:-19px;width:38px;height:38px;
    -webkit-appearance:none;appearance:none;padding:0;
    display:grid;place-items:center;cursor:pointer;z-index:3;
    color:#fff;background:rgba(15,15,16,.5);border:1px solid rgba(255,255,255,.35);
    border-radius:50%;opacity:0;transition:opacity .15s, background .15s;backdrop-filter:blur(2px);
  }
  .heronav.prev{left:14px}
  .heronav.next{right:14px}
  .heronav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .herostage:hover .heronav{opacity:.7}
  .heronav:hover{opacity:1;background:rgba(30,32,36,.85)}
  .heroprog{height:2px;margin-top:12px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
  .heroprog i{
    display:block;height:100%;width:100%;background:rgba(255,255,255,.4);
    transform-origin:left center;transform:scaleX(0);
  }
  @media (max-width:760px),(max-height:500px) and (orientation:landscape){ .hero{display:none} }
  @media (pointer:coarse){
    .heronav{opacity:.6;width:44px;height:44px;margin-top:-22px}
    .herokicker{font-size:12px}
  }

  .item{position:relative}
  .glow{
    position:absolute;left:-7%;width:114%;top:6%;aspect-ratio:16/9;
    background-size:cover;background-position:center;
    filter:blur(28px) saturate(1.4);
    opacity:.45;z-index:0;pointer-events:none;
    transition:opacity .3s ease, transform .3s ease, filter .3s ease;
    -webkit-transform:translateZ(0) scale(1);transform:translateZ(0) scale(1);
    will-change:transform;
  }
  .item:hover .glow{opacity:.8;transform:translateZ(0) scale(1.07) translateY(3px);filter:blur(32px) saturate(1.65)}
  .item.dragging{opacity:.35}
  .ghost{
    position:fixed;top:-300px;left:-300px;width:150px;height:84px;
    background-size:cover;background-position:center;border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;
  }
  .item.over .thumb{box-shadow:0 0 0 2px var(--focus)}
  .glow{border-radius:var(--thumb-radius)}

  .thumb{
    position:relative;z-index:1;display:block;width:100%;aspect-ratio:16/9;
    background:#000;border-radius:var(--thumb-radius);overflow:hidden;cursor:pointer;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .play{
    position:absolute;inset:0;margin:auto;width:34px;height:34px;display:grid;place-items:center;
    background:rgba(20,20,20,.35);border:1px solid rgba(255,255,255,.75);border-radius:50%;
    opacity:.75;transition:opacity .15s ease, transform .15s ease;backdrop-filter:blur(2px);
  }
  .play svg{width:11px;height:11px;fill:#fff;margin-left:2px}
  .thumb:hover .play{opacity:1;transform:scale(1.06)}
  .tdel,.tback,.theart,.tkebab,.tlater{
    position:absolute;padding:0;display:grid;place-items:center;
    color:#fff;font-size:13px;line-height:1;
    background:rgba(15,15,16,.5);border:1px solid rgba(255,255,255,.35);border-radius:50%;
    opacity:0;transition:opacity .12s, color .12s;backdrop-filter:blur(2px);
  }
  .theart{top:7px;right:7px;width:32px;height:32px}
  .tlater{top:47px;right:7px;width:32px;height:32px}
  .tdel{top:87px;right:7px;width:32px;height:32px}
  .tback{top:7px;left:7px;width:22px;height:22px;font-size:12px}
  .tkebab{top:7px;left:7px;width:22px;height:22px}
  .tdel svg,.theart svg,.tlater svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tkebab svg{width:14px;height:14px;fill:currentColor;stroke:none}
  .item:hover .tdel,.item:hover .tback,.item:hover .theart,.item:hover .tkebab,.item:hover .tlater{opacity:.7}
  .tdel:hover{opacity:1;background:rgba(150,50,50,.65)}
  .tback:hover,.tkebab:hover{opacity:1;background:rgba(30,32,36,.85)}
  .theart:hover,.tlater:hover{opacity:1}
  .theart.active{color:#ff4d5e}
  .theart.active svg{fill:currentColor}
  .tlater.active{color:#8ec5e0;border-color:rgba(142,197,224,.6)}

  .meta{position:relative;z-index:1;display:flex;align-items:flex-start;gap:8px;margin-top:9px}
  .channel{font-size:12px;color:var(--ink-dim);letter-spacing:.15px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .channel .chlink{color:inherit;text-decoration:none}
  .channel .chlink:hover{text-decoration:underline;color:var(--ink)}
  .title{flex:1;font-size:13.5px;line-height:1.35;color:var(--ink);border-radius:3px;padding:1px 3px;margin:-1px -3px}
  .title:focus{outline:none;background:#26292d}
  .drag{background:none;border:0;color:#5f6367;padding:2px 4px;font-size:14px;line-height:1;cursor:grab;opacity:0;transition:opacity .12s}
  .item:hover .drag{opacity:1}
  .drag:hover{color:var(--ink)}

  .empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;min-height:52vh;padding:40px 20px;
    color:var(--ink-dim);font-size:13px;
  }
  .empty[hidden]{display:none}
  .empty p{margin:0;max-width:56ch;line-height:1.55;opacity:.85;text-wrap:balance}
  .empty .link{
    color:var(--ink);font:inherit;font-size:inherit;padding:0;
    border-bottom:1px solid #4b5157;border-radius:0;
  }
  .empty .link:hover{border-bottom-color:var(--ink)}
  .empty svg{
    width:42px;height:42px;fill:none;stroke:#6f8fb8;stroke-width:1.1;
    stroke-linecap:round;stroke-linejoin:round;opacity:.9;
    animation:iconglow 14s ease-in-out infinite;
  }
  @keyframes iconglow{
    0%,100%{stroke:#7196c2;filter:drop-shadow(0 0 9px rgba(113,150,194,.45))}
    33%{stroke:#9d80c8;filter:drop-shadow(0 0 11px rgba(157,128,200,.45))}
    66%{stroke:#6fbfa4;filter:drop-shadow(0 0 10px rgba(111,191,164,.45))}
  }
  @media (prefers-reduced-motion:reduce){ .empty svg{animation:none} }
  .note{
    position:fixed;left:28px;bottom:22px;z-index:60;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    color:var(--ink-dim);font-size:12.5px;padding:7px 12px;
  }
  .note button{color:var(--ink);text-decoration:underline;margin-left:10px}

  /* settings */
  .backdrop{position:fixed;inset:0;background:rgba(10,10,11,.6);z-index:70;display:none;place-items:center;padding:20px}
  .backdrop.on{display:grid}

  /* ---------- bottom sheets (phone) ---------- */
  .backdrop.sheet{padding:0;place-items:end stretch}
  .sheetbox{
    background:var(--panel);border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;padding:6px 18px 18px;
    padding-bottom:calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -18px 50px rgba(0,0,0,.5);
    max-height:80vh;max-height:80dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .backdrop.sheet.on .sheetbox{animation:sheetup .22s ease}
  @keyframes sheetup{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){ .backdrop.sheet.on .sheetbox{animation:none} }
  .grip{width:38px;height:4px;border-radius:2px;background:#4a4e54;margin:6px auto 16px}
  .sheethead{display:flex;align-items:flex-start;gap:14px;justify-content:space-between;margin-bottom:14px}
  .sheethead h2{
    font-size:15px;font-weight:600;margin:0;line-height:1.35;min-width:0;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  }
  .sheethead .modalx{flex:none;padding:8px;margin:-8px -8px 0 0}
  .sheethead .modalx svg{width:16px;height:16px}
  .sheetrow{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    padding:15px 2px;font-size:16px;color:var(--ink);
    border-bottom:1px solid var(--line);border-radius:0;
  }
  .sheetrow:last-child{border-bottom:0}
  .sheetrow svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .sheetrow.fav.active{color:#ff4d5e}
  .sheetrow.fav.active svg{fill:currentColor}
  .sheetrow.later.active{color:#8ec5e0}
  .sheetrow.danger{color:#d98a8a}
  input.sheetinput{
    display:block;width:100%;background:#1c1e21;border:1px solid var(--line);
    border-radius:10px;padding:14px;color:var(--ink);font:inherit;font-size:16px;
    margin-bottom:14px;
  }
  input.sheetinput:focus{outline:none;border-color:var(--focus)}
  .sheetgo{
    display:block;width:100%;text-align:center;padding:15px;border-radius:10px;
    background:#2a2d31;border:1px solid #4d525a;color:var(--ink);font-size:16px;
  }
  /* the name of whatever you opened, set to line up with the first row in
     the sidebar; margin-top is tuned so the cap heights match */
  .viewtitle{
    font-size:30px;font-weight:800;letter-spacing:-.15px;color:var(--ink);
    margin:0 0 23px;line-height:1.2;
  }
  .trashbar{display:none;margin:0 0 16px}
  .trashbar button{
    padding:11px 16px;border:1px solid var(--line);border-radius:999px;
    color:var(--ink-dim);font-size:15px;
  }

  /* video player */
  .playerbackdrop{
    position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:4vh 4vw;
    background:rgba(10,10,11,.75);
    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  }
  .playerbackdrop.on{display:grid}
  .playerbox{
    position:relative;
    width:min(80vw, calc(80vh * 16 / 9));
    height:min(80vh, calc(80vw * 9 / 16));
    background:#000;border-radius:10px;overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.6);
  }
  .playerbox iframe{width:100%;height:100%;border:0;display:block}
  #playerslot{width:100%;height:100%}
  .playerx{
    position:absolute;top:-38px;right:0;color:var(--ink-dim);
    display:grid;place-items:center;width:28px;height:28px;
  }
  .playerx:hover{color:var(--ink)}
  .playerx svg{width:16px;height:16px}
  @media (max-width:760px),(max-height:500px) and (orientation:landscape){
    .playerbackdrop{padding:0}
    .playerbox{width:100vw;height:100vh;border-radius:0}
    .playerx{top:10px;right:10px;background:rgba(15,15,16,.5);border-radius:50%}
  }

  /* Touch devices (iPad, iPhone) only - never triggered by resizing a
     desktop browser window, since that keeps a fine (mouse) pointer. */
  @media (pointer:coarse){
    .navinner{font-size:15px}
    input[type=text]{font-size:15px}
    .luckybtn{font-size:15px;padding:8px 20px}
    button{font-size:14px}

    .icon{padding:6px}
    .icon svg{width:22px;height:22px}
    .logoicon{width:26px;height:26px}

    aside.collapsed .sidetoggle{width:34px;height:34px}
    .sidetoggle{font-size:15px}
    .sidetoggle svg{width:17px;height:17px}
    #side{font-size:15px}
    .col{padding:9px 8px;margin:0 -8px;gap:10px}
    .col .n{font-size:13px}
    .col .side{width:22px;height:20px}
    .col .edit{width:26px;height:26px;margin-top:-13px}
    .col .edit svg{width:19px;height:19px}
    .divide{margin:14px -8px 12px}
    .newcol{font-size:15px;padding:9px 8px;margin:0 -8px}

    .sectionhead{font-size:15.5px}
    .sectionhead .cnt{font-size:13px}
    .channel{font-size:14px}
    .title{font-size:15.5px}
    .empty{font-size:15px}
    .empty svg{width:50px;height:50px}
    .note{font-size:14.5px;padding:9px 14px}

    #backdrop .modal{width:min(600px,100%)}
    .modal{font-size:15px}
    .modal h2{font-size:16px}
    .modalx svg{width:18px;height:18px}
    .group>.label{font-size:12px}
    .opt{font-size:15px;padding:8px 7px}
    .chip{font-size:14px;padding:6px 12px}
    .switchrow{padding:8px 7px}
    .switchrow .lbl{font-size:15px}
    .switch{width:40px;height:24px}
    .switch .knob{width:20px;height:20px}
    .switch.on .knob{transform:translateX(16px)}
    .btnrow{font-size:15px;padding:12px 14px}
    .btnrow svg{width:18px;height:18px}
    .about{font-size:13px}
    .version{font-size:12.5px}
    input.colinput,select.colinput{font-size:15px;padding:10px 12px}
  }
  .modal{
    width:min(360px,100%);background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:22px 22px 16px;font-size:13px;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
    max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  #backdrop .modal{width:min(560px,100%)}
  .switchrow{
    display:flex;align-items:center;justify-content:space-between;
    padding:5px 7px;margin:0 -7px;border-radius:3px;cursor:pointer;
  }
  .switchrow:hover{background:#26292d}
  .switchrow .lbl{font-size:13px;color:var(--ink-dim)}
  .switchrow.on .lbl{color:var(--ink)}
  .switch{
    position:relative;flex:none;width:34px;height:20px;border-radius:999px;
    background:#3a3d42;border:1px solid var(--line);transition:background-color .15s ease;
  }
  .switch .knob{
    position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;
    background:#c9ccd0;transition:transform .15s ease;
  }
  .switch.on{background:#48607a;border-color:#5b7793}
  .switch.on .knob{transform:translateX(14px);background:#fff}
  .modalhead{
    position:sticky;top:-22px;margin:-22px -22px 18px;padding:22px 22px 12px;
    background:var(--panel);z-index:1;
    display:flex;align-items:center;justify-content:space-between;
  }
  .modal h2{font-size:13px;font-weight:600;margin:0;letter-spacing:.2px}
  .modalx{margin:-4px -4px 0 0}
  .modalx svg{width:14px;height:14px}
  .group{margin-bottom:26px}
  .group > .label{
    font-size:9.5px;text-transform:uppercase;letter-spacing:1px;
    color:#707377;margin-bottom:9px;
  }
  .opt{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    padding:5px 7px;margin:0 -7px;border-radius:3px;color:var(--ink-dim);font-size:13px;
  }
  .opt:hover{background:#26292d;color:var(--ink)}
  .opt .tick{width:11px;opacity:0;color:var(--ink)}
  .opt.sel{color:var(--ink)}
  .opt.sel .tick{opacity:1}
  .btnrow{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:9px 12px;margin-bottom:8px;border:1px solid var(--line);border-radius:6px;
    color:var(--ink-dim);font-size:13px;background:transparent;text-decoration:none;
  }
  .btnrow:last-child{margin-bottom:0}
  .btnrow:hover{border-color:#4d525a;color:var(--ink);background:#212327}
  .btnrow svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .chips{display:flex;gap:6px}
  .chip{padding:4px 10px;border:1px solid var(--line);border-radius:3px;color:var(--ink-dim);font-size:12px}
  .chip:hover{color:var(--ink);border-color:#454a50}
  .chip.sel{color:var(--ink);border-color:#5b6168;background:#2a2d31}
  .about{margin:0;font-size:11.5px;line-height:1.55;color:#75787c}
  .about a{color:#9a9c9f;text-decoration:underline}
  .about a:hover{color:var(--ink)}
  .version{font-size:11px;color:#63666a;font-variant-numeric:tabular-nums}
  .modalfoot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
  .modalfoot button{color:var(--ink-dim)}
  .modalfoot button:hover{color:var(--ink)}
  .modalfoot .btn-go{color:#8ec5e0}
  .modalfoot .btn-go:hover{color:#a9d6ec}
  .about.impnow{color:var(--ink-dim)}
  .about.impwarn{color:#c8a877}

  @media (max-width:760px),(max-height:500px) and (orientation:landscape){
    /* Safari's toolbar overlaps the bottom of the page */
    .wrap{padding:0 16px calc(60px + env(safe-area-inset-bottom))}
    .navinner{padding:10px 14px;height:58px;gap:10px;flex-wrap:nowrap;position:relative}
    .logo{flex:none;width:auto;margin-right:0;min-width:0}
    body.sidebar-collapsed .logo{flex:none;width:auto}
    .logotext{display:block!important;white-space:nowrap}
    :root{--nav-h:58px}
    #size{display:none}

    /* moved into a sheet, or dropped on a phone */
    .urlwrap,.luckywrap,#zoomdown,#zoomup,#emptytrash{display:none}

    /* one row: logo, gap, three equal circles */
    .sep{order:1}
    .searchwrap{order:5}
    .tools{order:6;gap:10px}
    .circwrap{display:block}
    #addbtn{display:grid}
    .circbtn{
      display:grid;place-items:center;width:38px;height:38px;padding:0;
      background:rgba(23,24,26,.72);border-radius:999px;color:var(--ink);opacity:1;
    }
    .circbtn svg{width:18px;height:18px}
    #gear.circbtn svg{width:19px;height:19px}

    /* search takes over the whole bar; the rest steps aside while it is open */
    .searchwrap.open{position:absolute;left:14px;right:14px;top:10px;z-index:5}
    .searchwrap.open .searchbox{width:100%;height:38px}
    .searchwrap.open .searchx{width:44px;height:38px}
    body.searching .logo,body.searching .tools{visibility:hidden}

    /* iOS zooms the page in when a focused field is under 16px */
    input[type=text],input.sheetinput{font-size:16px}
    .body{display:block}
    aside{width:auto;flex:none;position:static;height:auto;display:block}
    aside::before{display:none}
    .sidetoggle{display:none}
    #side{
      position:static;display:flex;gap:8px;overflow-x:auto;overflow-y:visible;
      padding:2px 2px 4px;margin:0 -16px 14px;padding-left:16px;padding-right:16px;
      border-bottom:none;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;-ms-overflow-style:none;
    }
    #side::-webkit-scrollbar{display:none}
    .col{
      flex:none;margin:0;white-space:nowrap;
      padding:7px 13px;border:1px solid var(--line);border-radius:999px;
      background:var(--panel);
    }
    .col.active{background:#2a2d31;border-color:#4d525a;color:var(--focus)}
    .col.sub::before{display:none}
    .col .ico:empty{display:none}
    .newrow{gap:8px;margin:0;padding:0;flex:none}
    .col .n{margin-left:1px}
    .col .side{position:static;display:flex;align-items:center;gap:4px;width:auto;height:auto}
    .col .n{position:static;opacity:.5}
    .col .edit{position:static;opacity:.5}
    .divide{display:none}
    .searchbox{height:38px;width:38px}
    .searchico,.searchx{width:38px;height:38px}
    .searchico svg{width:18px;height:18px}
    .newcol{
      flex:none;width:auto;margin:0;white-space:nowrap;
      padding:7px 13px;border:1px dashed var(--line);border-radius:999px;opacity:.7;
    }
    main{margin-left:0}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
    .title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
    /* one kebab per thumbnail, everything else lives in its bottom sheet */
    .tkebab{top:7px;right:7px;left:auto;width:34px;height:34px;opacity:.75}
    .tkebab svg{width:16px;height:16px}
    .glow{filter:blur(20px) saturate(1.4);opacity:.38}
    .trashbar{display:block}

    /* every dialog becomes a bottom sheet on a phone, and never taller than
       what Safari actually shows */
    .backdrop{padding:0;place-items:end stretch}
    .backdrop .modal{
      width:100%!important;max-width:none;
      border-radius:16px 16px 0 0;border-left:0;border-right:0;border-bottom:0;
      max-height:86vh;max-height:86dvh;
      padding-bottom:calc(16px + env(safe-area-inset-bottom));
    }
    .backdrop.on .modal{animation:sheetup .22s ease}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="navinner">
    <button class="logo" id="logo">
      <svg class="logoicon" viewBox="2.5 5 19 14"><rect x="2.5" y="5" width="19" height="14" rx="3.5"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg>
      <span class="logotext">YT-Playlists</span>
    </button>
    <div class="addwrap urlwrap"><input type="text" id="url" spellcheck="false"></div>
    <div class="addwrap luckywrap"><button class="luckybtn" id="lucky"></button></div>
    <div class="addwrap searchwrap" id="searchwrap">
      <div class="searchbox">
        <button class="searchico" id="searchbtn">
          <svg viewBox="0 0 24 24"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
        </button>
        <input type="text" id="search" spellcheck="false">
        <button class="searchx" id="searchx">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div class="sep"></div>
    <div class="tools">
      <button id="emptytrash"></button>
      <div class="addwrap circwrap">
        <button class="icon circbtn" id="addbtn">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <button class="icon" id="zoomdown" aria-label="-">
        <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
      </button>
      <button class="icon" id="zoomup" aria-label="+">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="addwrap circwrap">
        <button class="icon circbtn" id="gear">
        <svg viewBox="0 0 24 24"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="body">
    <aside id="aside">
      <div id="side"></div>
      <button class="sidetoggle" id="sidetoggle">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        <span class="lbl"></span>
      </button>
    </aside>
    <main>
      <div class="hero" id="hero" hidden></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden></div>
    </main>
  </div>
</div>

<div class="playerbackdrop" id="playerbackdrop">
  <div class="playerbox">
    <button class="icon playerx" id="player-x" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div id="playerslot"></div>
  </div>
</div>

<div class="backdrop" id="colbackdrop">
  <div class="modal" role="dialog" aria-modal="true" style="width:min(320px,100%)">

  function emojiSearch(q){
    var all=emojiList();
    if(!q) return all;

    for(var i=0;i<all.length;i++) if(re.test(all[i][1])) out.push(all[i]);
    return out;
  }

  var store={
    async get(){
      try{ var r=await window.storage.get(KEY); if(r) return JSON.parse(r.value); }catch(e){}
      try{ var l=localStorage.getItem(KEY); if(l) return JSON.parse(l); }catch(e){}
      return mem;
    },
    async set(v){
      mem=v; var s=JSON.stringify(v);
      try{ await window.storage.set(KEY, s); }catch(e){}
      try{ localStorage.setItem(KEY, s); }catch(e){}
    }
  };

  function t(k){
    var s=(T[state.lang]&&T[state.lang][k]) || T.en[k] || k;

  function parseId(s){
    s=(s||'').trim();
    var m=s.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    if(m) return m[1];
    if(/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
    return null;
  }

  async function fetchMeta(id){
    var u='https://www.youtube.com/watch?v='+id;
    try{
      var r=await fetch('https://www.youtube.com/oembed?url='+encodeURIComponent(u)+'&format=json');
      if(r.ok){ var j=await r.json(); if(j.title) return {title:j.title, channel:j.author_name||'', channelUrl:j.author_url||''}; }
    }catch(e){}
    try{
      var r2=await fetch('https://noembed.com/embed?url='+encodeURIComponent(u));
      if(r2.ok){ var j2=await r2.json(); if(j2.title) return {title:j2.title, channel:j2.author_name||'', channelUrl:j2.author_url||''}; }
    }catch(e){}
    return null;
  }
  function fillMeta(id){
    fetchMeta(id).then(function(m){
      if(!m) return;
      var v=find(id); if(!v) return;
      var ch=false;
      if(v.title===id && m.title){ v.title=m.title; ch=true; }
      if(!v.channel && m.channel){ v.channel=m.channel; ch=true; }
      if(!v.channelUrl && m.channelUrl){ v.channelUrl=m.channelUrl; ch=true; }
      if(ch){ save(); render(); }
    });
  }

  // ---------- search ----------

  function searching(){ return query.trim().length>0; }
  // Fold case and accents, so "cafe" also finds "caf\u00e9".
  function norm(str){
    str=String(str||'').toLowerCase();
    return str.normalize? str.normalize('NFD').replace(/[\u0300-\u036f]/g,'') : str;
  }

  // A phone, or a phone held sideways. Deliberately width/height based and
  // not pointer:coarse, so an iPad keeps the full layout.
  var phoneMQ=window.matchMedia('(max-width:760px),(max-height:500px) and (orientation:landscape)');
  function phone(){ return phoneMQ.matches; }
  if(phoneMQ.addEventListener) phoneMQ.addEventListener('change', function(){ render(); });
  else if(phoneMQ.addListener) phoneMQ.addListener(function(){ render(); });

  function nVid(n){ return n===1? t('vid1') : t('vidN', n); }
  function nCol(n){ return n===1? t('col1') : t('colN', n); }

  function find(id){ return state.videos.find(function(x){return x.id===id}); }
  function cols(v){ if(!Array.isArray(v.cols)) v.cols=[]; return v.cols; }
  function sortedCols(){
    return state.collections.slice().sort(function(a,b){
      return a.name.localeCompare(b.name, state.lang, {sensitivity:'base'});
    });
  }
  function folders(){ if(!Array.isArray(state.folders)) state.folders=[]; return state.folders; }
  function openFolders(){ if(!Array.isArray(state.openFolders)) state.openFolders=[]; return state.openFolders; }
  function findFolder(id){ return folders().find(function(f){return f.id===id}); }
  function isFolder(id){ return !!(id && id.charAt(0)==='f' && findFolder(id)); }
  function sortedFolders(){
    return folders().slice().sort(function(a,b){
      return a.name.localeCompare(b.name, state.lang, {sensitivity:'base'});
    });
  }
  function listsInFolder(fid){
    return sortedCols().filter(function(c){ return c.folder===fid; });
  }
  // a video in two lists of the same folder still counts once
  function folderCount(fid, live){
    var ids=listsInFolder(fid).map(function(c){return c.id});
    if(!ids.length) return 0;
    return live.filter(function(v){
      return cols(v).some(function(c){ return ids.indexOf(c)>=0; });
    }).length;
  }

  function colName(cid){
    if(cid==='trash') return t('trash');
    if(cid==='all') return t('all');
    if(cid==='fav') return t('favorites');
    if(cid==='later') return t('later');
    var f=findFolder(cid);
    if(f) return f.name;
    var c=state.collections.find(function(x){return x.id===cid});
    return c? c.name : null;
  }
  function daysLeft(v){ return Math.max(0, KEEP - Math.floor((Date.now()-v.trashed)/DAY)); }

  // Reliable tap handling for iOS Safari: taps inside a horizontally
  // scrolling container (our mobile collection strip) sometimes don't
  // fire a plain 'click'. We track touch movement ourselves and, for a
  // real tap (no scroll), call the handler on touchend and suppress the
  // browser's own follow-up click so it doesn't fire twice.
  function bindTap(el, handler){
    var sx=0, sy=0, moved=false;
    el.addEventListener('touchstart', function(e){
      var t=e.touches[0]; sx=t.clientX; sy=t.clientY; moved=false;
    }, {passive:true});
    el.addEventListener('touchmove', function(e){
      var t=e.touches[0];
      if(Math.abs(t.clientX-sx)>10 || Math.abs(t.clientY-sy)>10) moved=true;
    }, {passive:true});
    el.addEventListener('touchend', function(e){
      if(!moved){ e.preventDefault(); handler(e); }
    });
    el.addEventListener('click', handler);
  }

  function visible(){
    var q=norm(query.trim());
    var v=state.videos.filter(function(x){
      // search runs over the whole library, minus the bin
      if(q) return !x.trashed && (norm(x.title).indexOf(q)>=0 || norm(x.channel).indexOf(q)>=0);
      if(state.active==='trash') return !!x.trashed;
      if(x.trashed) return false;
      if(state.active==='fav') return !!x.fav;
      if(state.active==='later') return !!x.later;
      if(isFolder(state.active)){
        var ids=listsInFolder(state.active).map(function(c){return c.id});
        return cols(x).some(function(c){ return ids.indexOf(c)>=0; });
      }
      return state.active==='all' || cols(x).indexOf(state.active)>=0;
    });
    var L=state.lang;
    if(state.sort==='az') v.sort(function(a,b){return a.title.localeCompare(b.title,L,{sensitivity:'base'})});
    if(state.sort==='za') v.sort(function(a,b){return b.title.localeCompare(a.title,L,{sensitivity:'base'})});
    if(state.sort==='new') v.sort(function(a,b){return b.added-a.added});
    if(state.sort==='old') v.sort(function(a,b){return a.added-b.added});
    if(!q && state.active==='trash' && state.sort==='manual') v.sort(function(a,b){return b.trashed-a.trashed});
    return v;
  }

  function save(){
    store.set({videos:state.videos, collections:state.collections, folders:state.folders,
      openFolders:state.openFolders, active:state.active,
      sort:state.sort, cols:state.cols, lang:state.lang, groupByCollection:state.groupByCollection,
      showHero:state.showHero, sidebarCollapsed:state.sidebarCollapsed});
  }
  function purge(){
    var n=state.videos.length;
    state.videos=state.videos.filter(function(v){ return !(v.trashed && Date.now()-v.trashed > KEEP*DAY); });
    return n!==state.videos.length;
  }

  // ---------- sidebar ----------
  var tipEl=null, tipTimer=null, TIP_DELAY=5000;
  var finePointer=window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  function hideTip(){ clearTimeout(tipTimer); if(tipEl) tipEl.classList.remove('on'); }
  function showTip(el, text){
    if(!tipEl){ tipEl=document.createElement('div'); tipEl.className='tip'; document.body.appendChild(tipEl); }
    tipEl.textContent=text;
    tipEl.style.left='0px'; tipEl.style.top='0px';
    tipEl.classList.add('on');
    var r=el.getBoundingClientRect(), w=tipEl.offsetWidth, h=tipEl.offsetHeight;
    var x=Math.min(window.innerWidth-w-8, Math.max(8, r.left+r.width/2-w/2));
    var y=r.bottom+8;
    if(y+h>window.innerHeight-8) y=r.top-h-8;
    tipEl.style.left=x+'px'; tipEl.style.top=y+'px';
  }
  function attachTip(el, text){
    el.setAttribute('aria-label', text);
    if(!finePointer) return;
    el.addEventListener('mouseenter',function(){
      clearTimeout(tipTimer);
      tipTimer=setTimeout(function(){ showTip(el, text); }, TIP_DELAY);
    });
    el.addEventListener('mouseleave', hideTip);
    el.addEventListener('mousedown', hideTip);
  }
  side.addEventListener('scroll', hideTip);

  function colRow(id,label,count,opts){
    opts=opts||{};
    var el=document.createElement('div');
    el.className='col'+(!searching() && state.active===id?' active':'')
      +(opts.sub?' sub':'')+(opts.last?' lastsub':'');
    var ico=document.createElement('div');
    ico.className='ico';
    if(opts.icon) ico.textContent=opts.icon;
    el.appendChild(ico);
    var n=document.createElement('div');
    n.className='name'; n.textContent=label; el.appendChild(n);
    var side=document.createElement('div');
    side.className='side'; el.appendChild(side);
    var c=document.createElement('span');
    c.className='n'; c.textContent=count||''; side.appendChild(c);

    if(opts.isFolder){
      var fedit=document.createElement('button');
      fedit.className='edit';
      fedit.innerHTML=GEAR_SVG;
      attachTip(fedit, t('folderEdit'));
      bindTap(fedit, function(e){ e.stopPropagation(); openFolderModal(id); });
      side.appendChild(fedit);
    }
    else if(id!=='all' && id!=='trash' && id!=='fav' && id!=='later'){
      n.title=t('rename');
      n.addEventListener('dblclick',function(){
        n.contentEditable='true'; n.focus(); document.getSelection().selectAllChildren(n);
      });
      n.addEventListener('blur',function(){
        n.contentEditable='false';
        var nv=n.textContent.trim();
        var col=state.collections.find(function(x){return x.id===id});
        if(col && nv && nv!==col.name){ col.name=nv; save(); render(); }
        else n.textContent=col?col.name:label;
      });
      n.addEventListener('keydown',function(e){
        if(e.key==='Enter'){ e.preventDefault(); n.blur(); }
        if(e.key==='Escape'){ n.textContent=colName(id); n.blur(); }
      });
      var edit=document.createElement('button');
      edit.className='edit';
      edit.innerHTML=GEAR_SVG;
      attachTip(edit, t('renameTitle'));
      bindTap(edit, function(e){ e.stopPropagation(); openColModal(id); });
      side.appendChild(edit);
    }

    if(opts.isFolder){
      // one click opens the folder and shows its videos, another closes it
      bindTap(el, function(){
        closeSearch(true);
        var open=openFolders().indexOf(id)>=0;
        if(open && state.active===id){
          state.openFolders=openFolders().filter(function(x){return x!==id});
          state.active='all';
        } else {
          if(!open) openFolders().push(id);
          state.active=id;
        }
        save(); render();
      });
      return el;   // a folder holds lists, not videos, so it is no drop target
    }

    bindTap(el, function(){ closeSearch(true); state.active=id; save(); render(); });
    el.addEventListener('dragover',function(e){
      if(e.dataTransfer.types.indexOf('text/plain')<0) return;
      e.preventDefault(); e.dataTransfer.dropEffect='move'; el.classList.add('drop');
    });
    el.addEventListener('dragleave',function(){ el.classList.remove('drop'); });
    el.addEventListener('drop',function(e){
      e.preventDefault(); e.stopPropagation(); el.classList.remove('drop');
      var v=find(e.dataTransfer.getData('text/plain'));
      if(!v) return;
      if(id==='trash'){ v.trashed=Date.now(); note(t('nTrash')); }
      else if(id==='fav'){
        if(v.trashed) delete v.trashed;
        if(v.fav) note(t('nAlready',colName('fav')));
        else{ v.fav=true; note(t('nAdded',colName('fav'))); }
      }
      else if(id==='later'){
        if(v.trashed) delete v.trashed;
        if(v.later) note(t('nAlready',colName('later')));
        else{ v.later=true; note(t('nAdded',colName('later'))); }
      }
      else{
        if(v.trashed) delete v.trashed;
        if(id==='all'){ v.cols=[]; note(t('nOutAll')); }
        else if(cols(v).indexOf(id)<0){ v.cols.push(id); note(t('nAdded',colName(id))); }
        else note(t('nAlready',colName(id)));
      }
      save(); render();
    });
    return el;
  }

  var GEAR_SVG='<svg viewBox="0 0 24 24"><path d="M9.7 4.1a2.34 2.34 0 0 1 4.6 0 2.34 2.34 0 0 0 3.4 1.9 2.34 2.34 0 0 1 2.3 4 2.34 2.34 0 0 0 0 3.9 2.34 2.34 0 0 1-2.3 4 2.34 2.34 0 0 0-3.4 1.9 2.34 2.34 0 0 1-4.6 0 2.34 2.34 0 0 0-3.4-1.9 2.34 2.34 0 0 1-2.3-4 2.34 2.34 0 0 0 0-3.9 2.34 2.34 0 0 1 2.3-4 2.34 2.34 0 0 0 3.4-1.9"/><circle cx="12" cy="12" r="3"/></svg>';

  function newButtonsRow(){
    var row=document.createElement('div');
    row.className='newrow';
    row.appendChild(newColButton(row));
    row.appendChild(newFolderButton());
    return row;
  }
  function newFolderButton(){
    var btn=document.createElement('button');
    btn.className='newcol'; btn.textContent=t('newfolder');
    btn.addEventListener('click',function(){ openFolderModal(null); });
    return btn;
  }
  function newColButton(row){
    var btn=document.createElement('button');
    btn.className='newcol'; btn.textContent=t('newcol');
    btn.addEventListener('click',function(){
      var inp=document.createElement('input');
      inp.type='text'; inp.id='newname'; inp.placeholder=t('name'); inp.spellcheck=false;
      if(row) row.classList.add('editing');
      btn.replaceWith(inp); inp.focus();
      var done=false;
      function commit(val){ if(done) return; done=true; addCollection(val); }
      inp.addEventListener('keydown',function(e){
        if(e.key==='Enter'){ e.preventDefault(); commit(inp.value); }
        if(e.key==='Escape'){ done=true; render(); }
      });
      inp.addEventListener('blur',function(){ commit(inp.value); });
    });
    return btn;
  }
  function divider(){ var d=document.createElement('div'); d.className='divide'; return d; }

  function renderSide(){
    hideTip();
    side.innerHTML='';
    var live=state.videos.filter(function(v){return !v.trashed});
    var trashed=state.videos.length-live.length;

    function countIn(cid){
      return live.filter(function(v){return cols(v).indexOf(cid)>=0}).length;
    }

    // on a phone an open folder takes over the whole strip
    if(phone() && isFolder(state.active)){
      var of=findFolder(state.active);
      side.appendChild(colRow(of.id, of.name, folderCount(of.id, live), {icon:of.icon||DEFAULT_ICON, isFolder:true}));
      listsInFolder(of.id).forEach(function(c){
        side.appendChild(colRow(c.id, c.name, countIn(c.id)));
      });
      var x=document.createElement('div');
      x.className='col closefolder'; x.title=t('closeFolder');
      x.innerHTML='<div class="ico"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></div>';
      bindTap(x, function(){
        state.openFolders=openFolders().filter(function(i){return i!==of.id});
        state.active='all'; save(); render();
      });
      side.appendChild(x);
      return;
    }

    side.appendChild(colRow('all',t('all'), live.length));
    var laterCount=live.filter(function(v){return v.later}).length;
    if(laterCount>0) side.appendChild(colRow('later',t('later'), laterCount));
    var favCount=live.filter(function(v){return v.fav}).length;
    if(favCount>0) side.appendChild(colRow('fav',t('favorites'), favCount));
    side.appendChild(newButtonsRow());

    var fl=sortedFolders();
    if(fl.length){
      side.appendChild(divider());
      fl.forEach(function(f){
        side.appendChild(colRow(f.id, f.name, folderCount(f.id, live), {icon:f.icon||DEFAULT_ICON, isFolder:true}));
        // on a phone an open folder gets its own strip, so no nesting here
        if(!phone() && openFolders().indexOf(f.id)>=0){
          var inside=listsInFolder(f.id);
          inside.forEach(function(c,i){
            side.appendChild(colRow(c.id, c.name, countIn(c.id), {sub:true, last:i===inside.length-1}));
          });
        }
      });
    }

    var roots=sortedCols().filter(function(c){ return !c.folder || !findFolder(c.folder); });
    if(roots.length){
      side.appendChild(divider());
      roots.forEach(function(c){
        side.appendChild(colRow(c.id, c.name, countIn(c.id)));
      });
    }
    if(trashed>0){
      side.appendChild(divider());
      side.appendChild(colRow('trash',t('trash'), trashed));
    }
  }

  function addCollection(name){
    name=(name||'').trim();
    if(!name){ render(); return; }
    var id='c'+Date.now().toString(36);
    state.collections.push({id:id,name:name});
    state.active=id; save(); render();
  }
  function addFolder(name, icon){
    name=(name||'').trim();
    if(!name) return null;
    var id='f'+Date.now().toString(36);
    folders().push({id:id, name:name, icon:icon||DEFAULT_ICON});
    openFolders().push(id);
    state.active=id; save(); render();
    return id;
  }
  function removeFolder(id){
    var f=findFolder(id);
    if(!f) return;
    var members=state.collections.filter(function(c){return c.folder===id}).map(function(c){return c.id});
    undo={run:function(){
      folders().push(f);
      members.forEach(function(cid){
        var c=state.collections.find(function(x){return x.id===cid});
        if(c) c.folder=f.id;
      });
    }};
    state.folders=folders().filter(function(x){return x.id!==id});
    state.collections.forEach(function(c){ if(c.folder===id) delete c.folder; });
    state.openFolders=openFolders().filter(function(x){return x!==id});
    if(state.active===id) state.active='all';
    save(); render();
    note(t('nFolderDel', f.name), true);
  }

  function removeCollection(id){
    var col=state.collections.find(function(x){return x.id===id});
    if(!col) return;
    var members=state.videos.filter(function(v){return cols(v).indexOf(id)>=0}).map(function(v){return v.id});
    undo={run:function(){
      state.collections.push(col);
      members.forEach(function(id){ var v=find(id); if(v && cols(v).indexOf(col.id)<0) v.cols.push(col.id); });
    }};
    state.collections=state.collections.filter(function(x){return x.id!==id});
    state.videos.forEach(function(v){ v.cols=cols(v).filter(function(c){return c!==id}); });
    if(state.active===id) state.active='all';
    save(); render();
    note(t('nColDel',col.name), true);
  }

  // ---------- gallery ----------
  function updateZoomDisabled(){
    zoomUp.disabled=state.cols<=COLS_MIN;   // + = bigger cards = fewer columns

    if(state.active==='later' && !state.videos.some(function(v){return v.later})) state.active='all';

       && !findFolder(state.active)) state.active='all';

      var msg = searching()? t('eSearch', query.trim())
        : trashView? t('eTrash') : (state.active==='all'? t('eAll') : t('eCol'));
      var bits = searching()? [msg] : msg.split('{0}');

        img.src=u; glow.style.backgroundImage='url("'+u+'")';

      if(showColLabels){

      item.appendChild(meta);

      item.addEventListener('dragstart',function(e){
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed='move';

        var ghost=document.createElement('div');
        ghost.className='ghost';
        if(img.src) ghost.style.backgroundImage='url("'+img.src+'")';
        document.body.appendChild(ghost);
        try{ e.dataTransfer.setDragImage(ghost,75,42); }catch(err){}
        setTimeout(function(){ ghost.remove(); },0);
      });
      item.addEventListener('dragend',function(){
        item.classList.remove('dragging');
        [].forEach.call(document.querySelectorAll('.item'),function(c){c.classList.remove('over')});
        [].forEach.call(side.children,function(c){c.classList.remove('drop')});

        e.preventDefault(); item.classList.add('over');
      });
      item.addEventListener('dragleave',function(){ item.classList.remove('over'); });
      item.addEventListener('drop',function(e){
        e.preventDefault(); item.classList.remove('over');
        if(state.sort!=='manual'||trashView) return;
        var from=e.dataTransfer.getData('text/plain');
        if(!from||from===v.id) return;
        var ids=state.videos.map(function(z){return z.id});
        var fi=ids.indexOf(from), ti=ids.indexOf(v.id);
        if(fi<0||ti<0) return;
        var moved=state.videos.splice(fi,1)[0];
        state.videos.splice(ti,0,moved);
        save(); render();
      });

      return item;
    }

    function buildSection(name,items){
      var sec=document.createElement('div'); sec.className='section';
      var head=document.createElement('div'); head.className='sectionhead';
      var nm=document.createElement('span'); nm.textContent=name; head.appendChild(nm);
      var cnt=document.createElement('span'); cnt.className='cnt'; cnt.textContent=items.length; head.appendChild(cnt);
      sec.appendChild(head);
      sec.appendChild(Object.assign(document.createElement('div'),{className:'sectiondivide'}));
      var g=document.createElement('div'); g.className='grid';
      items.forEach(function(v){ g.appendChild(buildItem(v)); });
      sec.appendChild(g);
      return sec;
    }

    var oldHead=document.querySelector('.searchhead');
    if(oldHead) oldHead.remove();
    var oldBar=document.querySelector('.trashbar');
    if(oldBar) oldBar.remove();
    var oldTitle=document.querySelector('.viewtitle');
    if(oldTitle) oldTitle.remove();
    // "All videos" keeps its own section heads, and a search has its own count
    if(!searching() && state.active!=='all'){
      var vt=document.createElement('div');
      vt.className='viewtitle';
      vt.textContent=colName(state.active) || '';
      if(vt.textContent) grid.parentNode.insertBefore(vt, grid);
    }
    if(trashView && list.length){
      var tb=document.createElement('div');
      tb.className='trashbar';
      var tbb=document.createElement('button');
      tbb.textContent=t('emptyTrash');
      bindTap(tbb, function(){ emptyTrashBtn.click(); });
      tb.appendChild(tbb);
      grid.parentNode.insertBefore(tb, grid);
    }

    renderHero();

    grid.innerHTML='';
    if(isFolder(state.active) && !trashView && list.length){
      // inside a folder the dividers per list are always shown, whatever the
      // "group by collection" setting says
      grid.className='sections';
      listsInFolder(state.active).forEach(function(c){
        var items=list.filter(function(v){ return cols(v).indexOf(c.id)>=0; });
        if(items.length) grid.appendChild(buildSection(c.name, items));
      });
      return;
    }
    if(searching()){
      grid.className='grid';
      if(list.length){
        var rh=document.createElement('div');
        rh.className='sectionhead searchhead';
        var rn=document.createElement('span');
        rn.textContent=list.length===1? t('result1') : t('results', list.length);
        rh.appendChild(rn);
        grid.parentNode.insertBefore(rh, grid);
      }
      list.forEach(function(v){ grid.appendChild(buildItem(v)); });
      return;
    }
    if(state.active==='all' && !trashView && state.collections.length && state.groupByCollection){
      grid.className='sections';
      sortedCols().forEach(function(c){
        var items=list.filter(function(v){ return cols(v).indexOf(c.id)>=0; });
        if(items.length) grid.appendChild(buildSection(c.name, items));
      });
      var loose=list.filter(function(v){ return !cols(v).length; });
      if(loose.length) grid.appendChild(buildSection(t('noCollection'), loose));
    } else {
      grid.className='grid';
      list.forEach(function(v){ grid.appendChild(buildItem(v)); });
    }
  }


  // ---------- watch later hero ----------
  // A full-width, auto-advancing band above the grid on "all videos".
  // One slide per watch-later video, crossfaded; the progress bar is driven
  // by requestAnimationFrame so it pauses cleanly instead of drifting.
  var heroEl=document.getElementById('hero');
  var HERO_MS=11000;
  var heroSlides=[], heroBar=null, heroIdx=0, heroElapsed=0, heroLast=0, heroRaf=null, heroPaused=false;

  function heroReduced(){
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  }
  function heroStop(){
    if(heroRaf){ cancelAnimationFrame(heroRaf); heroRaf=null; }
    heroLast=0;
  }
  function heroShow(i){
    if(!heroSlides.length) return;
    heroIdx=(i+heroSlides.length)%heroSlides.length;
    heroSlides.forEach(function(el,k){ el.classList.toggle('on', k===heroIdx); });
    heroElapsed=0; heroLast=0;
    if(heroBar) heroBar.style.transform='scaleX(0)';
  }
  function heroFrame(ts){
    heroRaf=requestAnimationFrame(heroFrame);
    if(!heroLast){ heroLast=ts; return; }
    var dt=ts-heroLast; heroLast=ts;
    // never advance while the user hovers, the player is open, or the tab is hidden
    if(heroPaused || document.hidden || playerBackdrop.classList.contains('on')) return;
    heroElapsed+=dt;
    var p=Math.min(1, heroElapsed/HERO_MS);
    if(heroBar) heroBar.style.transform='scaleX('+p+')';
    if(p>=1) heroShow(heroIdx+1);
  }

  function renderHero(){
    heroStop();
    heroSlides=[]; heroBar=null; heroPaused=false;
    heroEl.innerHTML='';

    var list=state.videos.filter(function(v){ return v.later && !v.trashed; });
    var on = state.showHero!==false && state.active==='all' && !searching() && list.length>0;
    heroEl.hidden=!on;
    if(!on) return;

    var head=document.createElement('div');
    head.className='sectionhead';
    var nm=document.createElement('span'); nm.textContent=t('later'); head.appendChild(nm);
    var cnt=document.createElement('span'); cnt.className='cnt'; cnt.textContent=list.length; head.appendChild(cnt);
    heroEl.appendChild(head);

    var stage=document.createElement('div');
    stage.className='herostage';
    heroEl.appendChild(stage);

    list.forEach(function(v,i){
      var sl=document.createElement('div');
      sl.className='heroslide'+(i===0?' on':'');

      var img=document.createElement('img');
      img.alt=''; img.draggable=false; img.loading = i===0? 'eager' : 'lazy';
      var sizes=['maxresdefault','sddefault','hqdefault','mqdefault'], si=0;
      function nextSrc(){
        if(si>=sizes.length) return;
        img.src='https://i.ytimg.com/vi/'+v.id+'/'+sizes[si++]+'.jpg';
      }
      img.onerror=function(){ nextSrc(); };
      img.onload=function(){
        if(img.naturalWidth<=120 && si<sizes.length) nextSrc();
      };
      nextSrc();
      sl.appendChild(img);

      var shade=document.createElement('div'); shade.className='heroshade'; sl.appendChild(shade);

      var inner=document.createElement('div'); inner.className='heroinner';
      if(v.channel){
        var kick=document.createElement('div');
        kick.className='herokicker'; kick.textContent=v.channel;
        inner.appendChild(kick);
      }
      var ttl=document.createElement('div');
      var len=(v.title||'').length;
      ttl.className='herotitle '+(len<=34?'s1':len<=62?'s2':len<=105?'s3':'s4');
      ttl.textContent=v.title;
      inner.appendChild(ttl);
      sl.appendChild(inner);

      stage.appendChild(sl);
      heroSlides.push(sl);
    });

    bindTap(stage, function(){
      var v=list[heroIdx];
      if(v) openYT(v);
    });

    if(list.length>1){
      var prev=document.createElement('button');
      prev.className='heronav prev'; prev.title=t('heroPrev'); prev.setAttribute('aria-label', t('heroPrev'));
      prev.innerHTML='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
      bindTap(prev, function(e){ e.stopPropagation(); heroShow(heroIdx-1); });
      stage.appendChild(prev);

      var next=document.createElement('button');
      next.className='heronav next'; next.title=t('heroNext'); next.setAttribute('aria-label', t('heroNext'));
      next.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
      bindTap(next, function(e){ e.stopPropagation(); heroShow(heroIdx+1); });
      stage.appendChild(next);

      var prog=document.createElement('div');
      prog.className='heroprog';
      heroBar=document.createElement('i');
      prog.appendChild(heroBar);
      heroEl.appendChild(prog);

      stage.addEventListener('mouseenter',function(){ heroPaused=true; });
      stage.addEventListener('mouseleave',function(){ heroPaused=false; heroLast=0; });

      if(!heroReduced()) heroRaf=requestAnimationFrame(heroFrame);
    }
  }

  function openVideoSheet(v, inTrash){
    document.getElementById('vids-title').textContent=v.title;
    var rows=document.getElementById('vids-rows');
    rows.innerHTML='';
    if(inTrash){
      rows.appendChild(sheetRow('', ICO.back, t('restore'), function(){

      }));
      rows.appendChild(sheetRow('danger', ICO.bin, t('delFor'), function(){

        save(); render();
      }));
    } else {
      rows.appendChild(sheetRow('fav'+(v.fav?' active':''), ICO.fav, v.fav? t('unfav') : t('fav'), function(){
        closeVideoSheet(); v.fav=!v.fav; save(); render();

        save(); render();

  var playerBackdrop=document.getElementById('playerbackdrop');

  function openYT(v, fullscreen){
    playerSlot.innerHTML='';
    var f=document.createElement('iframe');
    f.src='https://www.youtube.com/embed/'+v.id+'?autoplay=1';
    f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen=true;
    playerSlot.appendChild(f);

  async function add(text){
    var parts=(text||'').split(/[\s,]+/).filter(Boolean);
    var ids=[], bad=0;
    parts.forEach(function(p){
      var id=parseId(p);
      if(!id){ bad++; return; }
      var ex=find(id);
      if(ex){ if(ex.trashed){ delete ex.trashed; save(); render(); note(t('nUntrash')); } return; }
      if(ids.indexOf(id)<0) ids.push(id);
    });
    if(!ids.length){ if(bad) note(t('nBadUrl')); return; }
    var now=Date.now();
    var target=(state.active==='all'||state.active==='trash') ? [] : [state.active];
    ids.forEach(function(id,i){
      state.videos.push({id:id, title:id, channel:'', cols:target.slice(), added:now+i});
    });
    if(state.active==='trash') state.active='all';
    save(); render();
    ids.forEach(fillMeta);
  }

      folders:folders().map(function(f){ return Object.assign({}, f); }),

    };
    var jsonStr=JSON.stringify(data,null,2);
    var filename='video-gallery-'+new Date().toISOString().slice(0,10)+'.json';

    function fallbackDownload(){
      try{
        var blob=new Blob([jsonStr],{type:'application/json'});
        var url=URL.createObjectURL(blob);
        var a=document.createElement('a');
        a.href=url; a.download=filename;

    // On iPad/iPhone this opens the native share sheet, so "Save to Files"
    // can drop the backup straight into an iCloud Drive folder.
    // Requires https (or localhost) - falls back to a plain download otherwise.
    try{
      var file=new File([jsonStr], filename, {type:'application/json'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:filename}).then(function(){
          closeModal();
          note(t('nExport', nVid(data.videos.length), nCol(data.collections.length)));
        }).catch(function(err){
          if(err && err.name==='AbortError') return; // user cancelled the share sheet
          fallbackDownload();
        });
        return;
      }
    }catch(e){}
    fallbackDownload();
  });

  function merge(data){
    if(!data || !Array.isArray(data.videos)){ note(t('nBadFile')); return; }

    // snapshot for undo, taken before anything is touched
    var prev={
      videos:JSON.parse(JSON.stringify(state.videos)),
      collections:JSON.parse(JSON.stringify(state.collections)),
      folders:JSON.parse(JSON.stringify(folders())),
      openFolders:openFolders().slice(),
      active:state.active, sort:state.sort, lang:state.lang,
      groupByCollection:state.groupByCollection, showHero:state.showHero
    };

    state.folders=(data.folders||[])
      .filter(function(f){ return f && f.id && f.name; })
      .map(function(f){ var o=Object.assign({}, f); o.icon=f.icon||DEFAULT_ICON; return o; });
    var validFolders=state.folders.map(function(f){return f.id;});
    // collections keep every field too, so a folder link survives a round trip
    // through an older build instead of being quietly dropped
    state.collections=(data.collections||[])
      .filter(function(c){ return c && c.id && c.name; })
      .map(function(c){
        var o=Object.assign({}, c);
        if(o.folder && validFolders.indexOf(o.folder)<0) delete o.folder;
        return o;
      });
    state.openFolders=[];
    var validCols=state.collections.map(function(c){return c.id;});
    state.videos=data.videos.filter(function(v){ return v && v.id; }).map(function(v){
      // keep every field the file carries, then normalise the ones we know
      var o=Object.assign({}, v);
      o.id=v.id;
      o.title=v.title||v.id;
      o.channel=v.channel||'';
      o.channelUrl=v.channelUrl||'';
      o.cols=(v.cols||[]).filter(function(c){ return validCols.indexOf(c)>=0; });
      o.added=v.added||Date.now();
      delete o.col;
      if(!o.trashed) delete o.trashed;
      if(!o.fav) delete o.fav;
      if(!o.later) delete o.later;
      return o;
    });

    var st=data.settings;
    if(st && typeof st==='object'){
      if(['az','za','new','old','manual'].indexOf(st.sort)>=0) state.sort=st.sort;
      if(st.lang && T[st.lang]) state.lang=st.lang;
      if(typeof st.groupByCollection==='boolean') state.groupByCollection=st.groupByCollection;
      if(typeof st.showHero==='boolean') state.showHero=st.showHero;
    }

    if(state.active!=='all' && state.active!=='trash' && state.active!=='fav' && state.active!=='later'
       && validFolders.indexOf(state.active)<0 && validCols.indexOf(state.active)<0){
      state.active='all';
    }

    undo={run:function(){
      state.videos=prev.videos; state.collections=prev.collections;
      state.folders=prev.folders; state.openFolders=prev.openFolders;
      state.active=prev.active; state.sort=prev.sort; state.lang=prev.lang;
      state.groupByCollection=prev.groupByCollection; state.showHero=prev.showHero;
    }, note:t('nImportUndone')};

    save(); closeImportModal(); closeModal(); render();
    state.videos.forEach(function(v){ if(!v.channel || v.title===v.id || !v.channelUrl) fillMeta(v.id); });
    note(t('nImport', nVid(state.videos.length), nCol(state.collections.length)), true);
  }

  document.getElementById('impm-go').addEventListener('click',function(){
    if(pendingImport) merge(pendingImport);
  });
  document.getElementById('impm-cancel').addEventListener('click',closeImportModal);
  document.getElementById('impm-x').addEventListener('click',closeImportModal);
  impBackdrop.addEventListener('click',function(e){ if(e.target===impBackdrop) closeImportModal(); });

  (async function init(){
    var saved=await store.get();
    if(saved && saved.videos){ state=Object.assign(state,saved); }
    if(saved && saved.size && !saved.cols){
      state.cols=Math.max(COLS_MIN, Math.min(COLS_MAX, Math.round(1440/saved.size)));
    }
    if(!state.collections) state.collections=[];
    if(!Array.isArray(state.folders)) state.folders=[];
    if(!Array.isArray(state.openFolders)) state.openFolders=[];
    // drop links to folders that no longer exist
    state.collections.forEach(function(c){ if(c.folder && !findFolder(c.folder)) delete c.folder; });
    if(!T[state.lang]) state.lang='en';
    state.videos.forEach(function(v){
      if(!Array.isArray(v.cols)) v.cols = v.col ? [v.col] : [];
      delete v.col;
    });
    if(purge()) save();
    render();
    if(SEED.length){
      var before=state.active; state.active='all';
      await add(SEED.join(' '));
      state.active=before; render();
    }
    state.videos.forEach(function(v){ if(!v.channel || v.title===v.id || !v.channelUrl) fillMeta(v.id); });
  })();
})();
</script>
</body>
